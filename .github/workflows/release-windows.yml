name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release candidate
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Ensure tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_REF_TYPE -ne "tag") {
            throw "Release runs must select an existing version tag, including manual runs."
          }
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG must match package.json version v$version."
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify required release approval configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gates.mjs environment

      - name: Test approval gates
        run: npm run fix:test

      - name: Build, test and package
        run: npm run dist:win

      - name: Freeze candidate files and publish approval summary
        run: node scripts/release-gates.mjs prepare

      - name: Save verified candidate
        id: candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: .cache/release-candidate/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  publish:
    name: Approve and publish the verified candidate
    needs: build
    runs-on: windows-latest
    environment: release-production
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download the exact candidate artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: .cache/release-candidate/
          merge-multiple: true
      - name: Verify authorization and hashes, then publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gates.mjs publish
