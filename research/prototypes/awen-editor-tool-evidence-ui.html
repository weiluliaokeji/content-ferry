<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阿文工具调用与证据结果 · UI 原型</title>
  <style>
    :root { color-scheme: light; --ink:#22304a; --muted:#6e7d96; --line:#dfe6f1; --paper:#fff; --wash:#f4f7fb; --blue:#3c67d8; --blue-wash:#eef3ff; --green:#257b52; --green-wash:#edf9f2; --orange:#aa681c; --orange-wash:#fff5e7; --red:#b0444b; --red-wash:#fff0f1; --shadow:0 14px 34px rgba(38,57,94,.10); }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(135deg,#f5f8fc,#edf2f9); color:var(--ink); font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif; }
    button, input { font:inherit; }
    button { cursor:pointer; }
    .page { width:min(1440px,100%); margin:0 auto; padding:22px 26px 96px; }
    .prototype-note { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; padding:9px 13px; border:1px solid #f1d69f; border-radius:10px; background:#fff9e9; color:#7a581e; font-size:12px; }
    .prototype-note strong { letter-spacing:.06em; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:18px; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:23px; letter-spacing:-.02em; }
    h2 { font-size:16px; }
    h3 { font-size:14px; }
    .subhead { margin-top:5px; color:var(--muted); }
    .mode-switch { display:flex; gap:5px; padding:4px; border:1px solid var(--line); border-radius:10px; background:var(--paper); }
    .mode-switch button, .secondary { border:0; border-radius:7px; background:transparent; color:var(--muted); padding:7px 11px; }
    .mode-switch button.active, .primary { background:var(--blue); color:#fff; }
    .layout { display:grid; gap:16px; }
    .layout.a { grid-template-columns:minmax(0,1fr) 360px; }
    .layout.b { grid-template-columns:minmax(0,1fr) 410px; }
    .layout.c { grid-template-columns:minmax(0,1fr) 430px; }
    .panel { border:1px solid var(--line); border-radius:14px; background:var(--paper); box-shadow:var(--shadow); }
    .article { min-height:690px; padding:28px 34px; }
    .article.compact { padding:24px 28px; }
    .article-title { max-width:820px; margin-bottom:26px; font-size:30px; line-height:1.2; letter-spacing:-.035em; }
    .article-meta { display:flex; gap:8px; margin-bottom:27px; color:var(--muted); font-size:12px; }
    .tag { display:inline-flex; align-items:center; padding:3px 8px; border-radius:999px; background:#eef2f8; color:#52627b; }
    .article p { max-width:820px; margin:0 0 18px; color:#45536b; font-size:15px; line-height:1.85; }
    .article h2 { margin:32px 0 11px; font-size:21px; }
    .article-mark { border-left:3px solid #91a9ed; padding:9px 14px; border-radius:0 8px 8px 0; background:#f6f8ff; color:#38518e; }
    .toolbar { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:0 0 14px; }
    .toolbar button, .action-row button { border:1px solid var(--line); border-radius:8px; background:#fff; color:#41516b; padding:7px 10px; }
    .toolbar button.primary, .action-row button.primary { border-color:var(--blue); color:#fff; }
    .toolbar .spacer { flex:1; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 17px; border-bottom:1px solid var(--line); }
    .section-head small { color:var(--muted); }
    .rail { display:grid; align-content:start; gap:12px; }
    .activity-list { display:grid; gap:0; padding:7px 15px 13px; }
    .activity { display:grid; grid-template-columns:11px 1fr; gap:10px; padding:11px 0; border-bottom:1px solid #edf1f6; }
    .activity:last-child { border-bottom:0; }
    .dot { width:9px; height:9px; margin-top:5px; border-radius:50%; background:#9aa8bf; box-shadow:0 0 0 3px #edf1f6; }
    .activity.good .dot { background:#40a873; box-shadow:0 0 0 3px #e4f6ec; }
    .activity.warn .dot { background:#d78a32; box-shadow:0 0 0 3px #fff0d8; }
    .activity.bad .dot { background:#c65c63; box-shadow:0 0 0 3px #ffe5e7; }
    .activity-top { display:flex; justify-content:space-between; gap:10px; }
    .activity-top strong { font-size:12px; }
    .activity-top time { color:#9aa6b9; font-size:11px; white-space:nowrap; }
    .activity p { margin:2px 0 0; color:var(--muted); font-size:12px; line-height:1.45; }
    .card-body { padding:15px 17px; }
    .permission-card { border-color:#e9c993; background:#fffaf0; box-shadow:none; }
    .permission-card .card-body { color:#6f511f; }
    .permission-card .action-row { margin-top:12px; }
    .result-card { border-color:#bbd4c5; background:#f7fcf9; box-shadow:none; }
    .result-card p { margin-top:7px; color:#426250; }
    .provenance { margin-top:11px; padding:9px 10px; border:1px dashed #b8c7df; border-radius:8px; background:#f8faff; color:#52627b; font-size:11px; }
    .provenance code { color:#354d8e; }
    .action-row { display:flex; gap:7px; flex-wrap:wrap; }
    .action-row button { font-size:12px; }
    .status-strip { display:flex; align-items:center; gap:9px; margin-bottom:12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#f9fbfe; color:#53637d; }
    .status-strip strong { color:var(--ink); }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--blue); }
    .status-dot.warn { background:#d28a31; }
    .status-dot.good { background:#35a06c; }
    .status-dot.bad { background:#c55a64; }
    .chat { display:grid; gap:11px; padding:18px; }
    .message { max-width:92%; padding:11px 13px; border-radius:11px; color:#4d5c75; }
    .message.user { justify-self:end; background:#e9f0ff; color:#2d4c92; }
    .message.assistant { background:#f3f6fa; }
    .message strong { display:block; margin-bottom:3px; color:var(--ink); font-size:12px; }
    .message small { color:var(--muted); }
    .chat-tool { margin-top:9px; padding:10px; border:1px solid #d9e2f3; border-radius:9px; background:#fbfcff; }
    .chat-tool .tool-line { display:flex; align-items:center; justify-content:space-between; gap:10px; color:#42557b; font-size:12px; }
    .timeline { display:grid; gap:10px; padding:17px; }
    .timeline-item { display:grid; grid-template-columns:22px 1fr; gap:10px; }
    .timeline-icon { display:grid; place-items:center; width:22px; height:22px; border:1px solid #cdd9ee; border-radius:50%; background:#f4f7ff; color:#4164bb; font-size:11px; }
    .timeline-item.warn .timeline-icon { border-color:#efd19f; background:#fff8ec; color:#a66a20; }
    .timeline-item.good .timeline-icon { border-color:#bce0ca; background:#f0fbf4; color:#2f8b5e; }
    .timeline-item p { margin-top:2px; color:var(--muted); font-size:12px; }
    .stepper { display:flex; gap:0; padding:17px 18px 8px; overflow:auto; }
    .step { display:flex; align-items:center; gap:7px; min-width:126px; color:#75849a; font-size:11px; }
    .step:not(:last-child)::after { width:35px; height:1px; margin:0 8px; background:#dbe3ef; content:""; }
    .step i { display:grid; place-items:center; width:22px; height:22px; border:1px solid #d5deec; border-radius:50%; background:#fff; font-style:normal; }
    .step.done { color:#31855b; }
    .step.done i { border-color:#a9d8ba; background:#eefaf2; }
    .step.current { color:#3158b3; font-weight:600; }
    .step.current i { border-color:#8da7eb; background:#eef3ff; }
    .drawer-tabs { display:flex; gap:4px; padding:10px 15px 0; }
    .drawer-tabs button { border:0; border-bottom:2px solid transparent; background:transparent; color:var(--muted); padding:7px 8px; }
    .drawer-tabs button.active { border-color:var(--blue); color:var(--blue); font-weight:600; }
    .drawer-content { min-height:520px; padding:10px 15px 18px; }
    .result-list { display:grid; gap:10px; }
    .result-item { padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .result-item header { align-items:center; margin:0 0 5px; }
    .result-item header strong { font-size:12px; }
    .result-item p { color:#586982; font-size:12px; }
    .result-item.pending { border-color:#ecd19f; background:#fffaf1; }
    .result-item.adopted { border-color:#bbdcc8; background:#f7fcf9; }
    .empty { padding:40px 16px; text-align:center; color:var(--muted); }
    .guide { display:grid; gap:10px; margin-top:16px; padding:17px; border:1px solid #cbd8f4; border-radius:13px; background:#f6f8ff; }
    .guide p { color:#586a8b; font-size:12px; }
    .guide-actions { display:flex; flex-wrap:wrap; gap:7px; }
    .guide-actions button { border:1px solid #bacbf0; border-radius:8px; background:#fff; color:#3e5d9f; padding:7px 10px; font-size:12px; }
    .free-play { display:flex; flex-wrap:wrap; gap:7px; margin-top:13px; }
    .free-play button { border:1px solid #d2dbea; border-radius:8px; background:#fff; color:#53637c; padding:7px 9px; font-size:11px; }
    .switcher { position:fixed; z-index:20; bottom:18px; left:50%; display:flex; align-items:center; gap:8px; transform:translateX(-50%); padding:7px 10px; border:1px solid #263a64; border-radius:999px; background:#263a64; box-shadow:0 10px 28px rgba(23,39,77,.25); color:#fff; }
    .switcher button { width:28px; height:28px; border:0; border-radius:50%; background:#405580; color:#fff; }
    .switcher button:hover { background:#5973a9; }
    .switcher span { min-width:185px; text-align:center; font-size:12px; }
    @media (max-width:960px) { .layout.a,.layout.b,.layout.c { grid-template-columns:1fr; } .rail { grid-template-columns:repeat(2,minmax(0,1fr)); } .rail > .panel:first-child { grid-column:1/-1; } }
    @media (max-width:650px) { .page { padding:15px 12px 90px; } header { display:block; } .mode-switch { margin-top:13px; width:max-content; } .article { padding:20px 18px; } .article-title { font-size:25px; } .rail { display:grid; grid-template-columns:1fr; } .rail > .panel:first-child { grid-column:auto; } .switcher span { min-width:145px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="prototype-note"><strong>PROTOTYPE · 不接入生产数据</strong><span>本原型只验证编辑器内工具活动、授权和证据采纳的交互层次。</span></div>
    <header>
      <div><h1>阿文工具调用与资料结果</h1><p class="subhead">比较三种编辑器入口：执行发生在哪里、用户何时授权、结果怎样进入文章。</p></div>
      <div class="mode-switch" aria-label="文章场景"><button data-mode="new">新建草稿</button><button data-mode="edit" class="active">编辑已有文章</button></div>
    </header>
    <div id="app"></div>
  </main>
  <nav class="switcher" aria-label="原型版本切换"><button id="prev" aria-label="上一个版本">←</button><span id="variantLabel"></span><button id="next" aria-label="下一个版本">→</button></nav>
  <script>
    const variants = [
      { key:"A", name:"右侧执行活动", description:"活动、授权和结果都在编辑器右侧就地展开。" },
      { key:"B", name:"对话时间线", description:"阿文对话是主入口，工具调用显示为可展开的时间线卡片。" },
      { key:"C", name:"研究抽屉", description:"把活动、临时结果和 provenance 分成抽屉标签，适合长文章工作台。" }
    ];
    const query = new URLSearchParams(location.search);
    let variantIndex = Math.max(0, variants.findIndex((item) => item.key === (query.get("variant") || "A").toUpperCase()));
    let state = initialState();

    function initialState() {
      return {
        mode:"edit", stage:"idle", permission:"none", target:"Windows Sandbox",
        observation:"none", adoption:"none", suggestionApplied:false, activeTab:"activity",
        notice:"等待阿文发现需要核实的事实。", activities:[
          { tone:"", title:"工作台已就绪", detail:"你可以让阿文核实事实、读取源码或检查本地文件。", time:"现在" }
        ], result:null
      };
    }

    function now() { return new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" }); }
    function addActivity(next, title, detail, tone="") {
      return { ...next, activities:[...next.activities, { tone, title, detail, time:now() }].slice(-8) };
    }
    function reduce(current, action) {
      let next = { ...current };
      switch (action.type) {
        case "reset": return initialState();
        case "mode": return { ...initialState(), mode:action.mode, notice:action.mode === "new" ? "新草稿：研究结果可以直接参与生成，但仍保留 provenance。" : "编辑文章：研究结果会先变成建议，等待你决定是否应用。" };
        case "request-read":
          next = { ...next, stage:"running", permission:"allow", target:"Windows Sandbox", notice:"低风险只读调用已在授权范围内自动执行。", result:null };
          return addActivity(next,"读取资料与源码","项目范围内只读 · 策略自动放行","good");
        case "request-boundary":
          next = { ...next, stage:"waiting_user", permission:"ask", notice:"当前动作会运行验证代码，超出已有只读授权。" };
          return addActivity(next,"请求授权：运行验证 Demo","可能执行代码并产生临时产物 · 等待你的决定","warn");
        case "allow-once":
          next = { ...next, stage:"running", permission:"allow-once", notice:"只允许当前调用，完成后授权失效。" };
          return addActivity(next,"已允许一次","验证 Demo 在受限目标中运行","good");
        case "allow-task":
          next = { ...next, stage:"running", permission:"allow-task", notice:"本次任务内同类调用可继续执行，越界仍会询问。" };
          return addActivity(next,"已允许本次任务同类操作","授权租约限定工具、目标和副作用范围","good");
        case "reject":
          next = { ...next, stage:"denied", permission:"deny", notice:"当前动作未执行；阿文可以在不绕过拒绝的前提下寻找替代路径。" };
          return addActivity(next,"已拒绝当前动作","验证 Demo 没有启动 · 原拒绝约束仍有效","bad");
        case "replan":
          next = { ...next, stage:"replanning", permission:"none", notice:"阿文正在寻找不执行被拒绝动作的替代方案。" };
          return addActivity(next,"重新规划替代方案","改为固定版本只读检查 · 将重新经过策略判断","");
        case "switch-wsl":
          next = { ...next, stage:"running", permission:"allow", target:"WSL", notice:"同一授权目录内的只读目标切换已自动放行。" };
          return addActivity(next,"切换到 WSL 只读检查","目录、网络和副作用范围没有扩大 · 目标切换已记录","good");
        case "finish":
          next = { ...next, stage:"completed", result:{ title:current.mode === "new" ? "研究结果可吸收进新草稿" : "研究结果已形成编辑建议", body:"在固定版本中，目标文件存在；该结果只支持当前 commit 和读取范围。", provenance:"commit 8c4b2f1 · src/example.ts · L12-L28 · SHA-256 4e91…" }, notice:current.mode === "new" ? "结果已进入草稿生成上下文，并保留来源映射。" : "结果已作为建议等待应用，不会自动修改正文。" };
          return addActivity(next,current.mode === "new" ? "结果可吸收进新草稿" : "生成编辑建议",current.mode === "new" ? "保留 provenance · 未自动采纳为正式证据" : "等待你应用建议或保存为待核验证据","good");
        case "save-observation":
          next = { ...next, observation:"pending", notice:"已保存为待核验实验观察；保存不等于证据采纳。" };
          return addActivity(next,"保存为实验观察","绑定执行记录、目标、commit、行号和哈希 · 状态：待核验","warn");
        case "adopt":
          next = { ...next, observation:"accepted", adoption:"adopted", notice:"已采纳该证据主张，可进入提纲、正文或事实检查上下文。" };
          return addActivity(next,"作者已采纳证据","证据卡保留来源边界和 provenance","good");
        case "apply":
          next = { ...next, suggestionApplied:true, notice:"建议已应用到当前编辑草稿；正文仍由本地文章保存流程控制。" };
          return addActivity(next,"已应用编辑建议","只修改当前草稿，不改变证据采纳状态","good");
        case "tab": return { ...next, activeTab:action.tab };
        default: return current;
      }
    }

    function esc(value) { return String(value ?? "").replace(/[&<>"']/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch])); }
    function button(label, type, extra="", disabled=false) { return `<button class="${extra}" data-action="${type}" ${disabled ? "disabled" : ""}>${label}</button>`; }
    function stateLabel() { return { idle:"等待中", running:"执行中", waiting_user:"等待授权", denied:"已拒绝并准备重规划", replanning:"重新规划中", completed:"已完成" }[state.stage] || state.stage; }
    function statusStrip() {
      const tone = state.stage === "waiting_user" ? "warn" : state.stage === "completed" ? "good" : state.stage === "denied" ? "bad" : "";
      return `<div class="status-strip"><i class="status-dot ${tone}"></i><strong>${esc(stateLabel())}</strong><span>${esc(state.notice)}</span></div>`;
    }
    function articleMarkup(compact=false) {
      return `<section class="panel article ${compact ? "compact" : ""}">
        <div class="toolbar"><span class="tag">技术文章</span><span class="tag">${state.mode === "new" ? "新草稿" : "编辑中"}</span><span class="spacer"></span><button>保存草稿</button><button>预览</button></div>
        <h2 class="article-title">本地工具如何帮助技术文章完成事实核验</h2>
        <div class="article-meta"><span>未发布</span><span>·</span><span>最后编辑：刚刚</span></div>
        <p>写作过程中，阿文可以根据当前段落发现需要核实的事实，并在授权范围内读取资料、源码或运行受限检查。</p>
        <p class="article-mark">当前选中：工具调用不应把每一步都变成授权弹窗，也不能把一次授权解释成无限制权限。</p>
        <h2>先判断事实边界</h2>
        <p>本段内容仍在编辑中。右侧或对话中的活动卡会说明阿文正在读取什么、使用哪个执行目标，以及结果是否可以进入草稿或只能作为建议。</p>
        ${state.suggestionApplied ? `<p class="article-mark">已应用建议：在同一授权范围内，阿文可以自动切换到 WSL 进行只读检查。</p>` : ""}
      </section>`;
    }
    function activityList() {
      return `<div class="activity-list">${state.activities.map((item) => `<div class="activity ${item.tone}"><i class="dot"></i><div><div class="activity-top"><strong>${esc(item.title)}</strong><time>${esc(item.time)}</time></div><p>${esc(item.detail)}</p></div></div>`).join("")}</div>`;
    }
    function permissionCard() {
      if (state.permission !== "ask") return "";
      return `<section class="panel permission-card"><div class="section-head"><h2>需要你的授权</h2><span class="tag">ask</span></div><div class="card-body"><strong>运行验证 Demo</strong><p>可能执行代码并产生临时产物。当前只读授权不能覆盖这个动作。</p><div class="provenance">目标：Windows Sandbox · 网络：关闭 · 目录：项目 staging · 选择会影响本次任务的同类调用</div><div class="action-row">${button("仅允许一次","allow-once","primary")}${button("允许本次任务同类操作","allow-task")}${button("拒绝","reject")}</div></div></section>`;
    }
    function resultCard() {
      if (!state.result) return "";
      const observation = state.observation === "pending" ? `<span class="tag">待核验实验观察</span>` : state.observation === "accepted" ? `<span class="tag">已采纳证据</span>` : "";
      return `<section class="panel result-card"><div class="section-head"><h2>${esc(state.result.title)}</h2>${observation}</div><div class="card-body"><p>${esc(state.result.body)}</p><div class="provenance">${esc(state.result.provenance)}</div><div class="action-row">${state.mode === "edit" && !state.suggestionApplied ? button("应用编辑建议","apply","primary") : ""}${state.observation === "none" ? button("保存为实验观察","save-observation","primary") : ""}${state.observation === "pending" ? button("采纳为证据","adopt","primary") : ""}${state.observation === "accepted" ? `<span class="tag">已进入正式证据上下文</span>` : ""}</div></div></section>`;
    }
    function freePlay() { return `<div class="free-play"><button data-action="request-read">自动执行低风险读取</button><button data-action="request-boundary">触发授权询问</button><button data-action="replan">寻找替代方案</button><button data-action="switch-wsl">切换到 WSL 只读</button><button data-action="finish">显示结果</button><button data-action="save-observation">保存实验观察</button></div>`; }
    function guide() { return `<section class="guide"><div><h2>体验流程</h2><p>先选择一个流程，再按顺序点击；所有数据只存在本页内存。</p></div><div class="guide-actions"><button data-guide="draft">新稿：自动读取并吸收</button><button data-guide="reject">编辑：拒绝后重规划</button><button data-guide="evidence">编辑：保存并采纳证据</button></div>${freePlay()}</section>`; }
    function renderActivitiesPanel() { return `<section class="panel"><div class="section-head"><h2>执行活动</h2><small>${state.activities.length} 条记录</small></div>${activityList()}</section>`; }

    function renderA() {
      return `<div class="layout a"><div>${statusStrip()}${articleMarkup()}${guide()}</div><aside class="rail">${renderActivitiesPanel()}${permissionCard()}${resultCard()}</aside></div>`;
    }
    function renderB() {
      return `<div class="layout b"><div>${statusStrip()}${articleMarkup()}${guide()}</div><aside class="rail"><section class="panel"><div class="section-head"><h2>阿文对话</h2><small>${state.mode === "new" ? "新草稿协作" : "编辑建议"}</small></div><div class="chat"><div class="message user"><strong>你</strong>请核实这段关于本地执行目标的说法。</div><div class="message assistant"><strong>阿文</strong>${esc(state.notice)}<div class="chat-tool"><div class="tool-line"><span>读取资料与源码</span><span class="tag">${esc(state.permission === "ask" ? "等待授权" : state.stage === "completed" ? "已完成" : "只读")}</span></div><small>目标：${esc(state.target)} · 结果和来源会显示在这里</small></div></div>${permissionCard()}${resultCard()}</div></section><section class="panel"><div class="section-head"><h2>调用时间线</h2><small>可展开查看</small></div><div class="timeline">${state.activities.map((item,index) => `<div class="timeline-item ${item.tone}"><i class="timeline-icon">${index + 1}</i><div><strong>${esc(item.title)}</strong><p>${esc(item.detail)} · ${esc(item.time)}</p></div></div>`).join("")}</div></section></aside></div>`;
    }
    function drawerContent() {
      if (state.activeTab === "results") return `<div class="result-list">${state.result ? `<div class="result-item ${state.observation === "pending" ? "pending" : state.observation === "accepted" ? "adopted" : ""}"><header><strong>${esc(state.result.title)}</strong>${state.observation === "accepted" ? `<span class="tag">已采纳</span>` : state.observation === "pending" ? `<span class="tag">待核验</span>` : ""}</header><p>${esc(state.result.body)}</p><div class="provenance">${esc(state.result.provenance)}</div><div class="action-row">${state.observation === "none" ? button("保存为实验观察","save-observation","primary") : ""}${state.observation === "pending" ? button("采纳证据","adopt","primary") : ""}${state.mode === "edit" && !state.suggestionApplied ? button("应用建议","apply") : ""}</div></div>` : `<div class="empty">结果完成后会出现在这里。工具输出默认是临时材料。</div>`}</div>`;
      if (state.activeTab === "provenance") return `<div class="result-list"><div class="result-item"><header><strong>来源与边界</strong><span class="tag">${state.observation === "accepted" ? "已采纳" : "未采纳"}</span></header><p>该结果只支持固定 commit、指定文件和当前读取范围；不自动代表其他版本或其他环境。</p><div class="provenance"><code>execution://run-2048</code><br>commit 8c4b2f1<br>src/example.ts · L12-L28<br>SHA-256 4e91…</div></div></div>`;
      return activityList();
    }
    function renderC() {
      return `<div class="layout c"><div>${statusStrip()}${articleMarkup(true)}${guide()}</div><aside class="panel"><div class="section-head"><h2>研究抽屉</h2><small>不会自动修改正文</small></div><div class="drawer-tabs"><button data-tab="activity" class="${state.activeTab === "activity" ? "active" : ""}">活动</button><button data-tab="results" class="${state.activeTab === "results" ? "active" : ""}">临时结果</button><button data-tab="provenance" class="${state.activeTab === "provenance" ? "active" : ""}">来源链</button></div><div class="drawer-content">${permissionCard()}${drawerContent()}</div></aside></div>`;
    }
    function render() {
      const variant = variants[variantIndex];
      document.querySelector("#variantLabel").textContent = `${variant.key} · ${variant.name}`;
      document.querySelector("#app").innerHTML = variant.key === "A" ? renderA() : variant.key === "B" ? renderB() : renderC();
      document.querySelectorAll("[data-mode]").forEach((node) => node.classList.toggle("active", node.dataset.mode === state.mode));
    }
    function dispatch(type, extra={}) { state = reduce(state, { type, ...extra }); render(); }
    function runGuide(name) {
      state = initialState();
      if (name === "draft") { state.mode = "new"; ["request-read","switch-wsl","finish"].forEach((type) => { state = reduce(state,{type}); }); }
      if (name === "reject") { state.mode = "edit"; ["request-read","request-boundary","reject","replan","switch-wsl","finish"].forEach((type) => { state = reduce(state,{type}); }); }
      if (name === "evidence") { state.mode = "edit"; ["request-read","finish","save-observation","adopt"].forEach((type) => { state = reduce(state,{type}); }); }
      render();
    }
    function switchVariant(delta) { variantIndex = (variantIndex + delta + variants.length) % variants.length; query.set("variant", variants[variantIndex].key.toLowerCase()); history.replaceState(null,"",`${location.pathname}?${query.toString()}`); render(); }
    document.addEventListener("click", (event) => { const node = event.target.closest("button"); if (!node) return; if (node.dataset.action) dispatch(node.dataset.action); if (node.dataset.mode) dispatch("mode",{mode:node.dataset.mode}); if (node.dataset.guide) runGuide(node.dataset.guide); if (node.dataset.tab) dispatch("tab",{tab:node.dataset.tab}); });
    document.querySelector("#prev").addEventListener("click", () => switchVariant(-1));
    document.querySelector("#next").addEventListener("click", () => switchVariant(1));
    document.addEventListener("keydown", (event) => { const tag = event.target.tagName?.toLowerCase(); if (tag === "input" || tag === "textarea" || event.target.isContentEditable) return; if (event.key === "ArrowLeft") switchVariant(-1); if (event.key === "ArrowRight") switchVariant(1); });
    render();
  </script>
</body>
</html>
