        - description: >-
            - 参考图：模板参考图3，可重复。 - 用途：概念对照与逻辑总结正文。 - 布局：概念对照与收束页。 顶部标题左右为两个黑色概念，中间放爆炸形红黑VS。 其下先设一条带圆形头像的深蓝说明栏，再横排5张资料图片，接两段项目式文字。 底部为左右双色比较图：左侧深蓝标题、单向示意，右侧红色标题、多问题箭头网络； 中央以卡通形象和VS分隔，右下以结论卡或辅助信息收束。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写两组对照概念、顶部定义栏、资料图说明、两段依据文字和底部左右机制图； 左右两侧使用同一比较维度，中央VS只表示关系，不占第三对象。 资料图片、问题箭头和最终结论必须支持对照论点。 - 数量与编号：本页不设连续条目编号； 左右对照对象使用名称标识。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
    - id: "xhs-illustrated-industry-chain"
      description: >-
        适合展示一个系统从全景到前段、中段、后段的连续链路：封面与总览各一次，随后按阶段展开参与者、关键环节、流转关系和结果。白底配彩色手绘插图、编号节点、圆角分区和箭头流程。 可迁移到产业生态、供应链、生命周期、组织协作或服务流程。
      text: >-
        - 模板规则：整套采用黑色书写感大标题、粗黑正文、带深色描边的彩色手绘插画，以及浅黄、浅蓝、浅绿、浅紫等圆角标题底。 正文页均为白底，上方页名，下方以编号栏目、卡片、箭头或流程图展开； 无固定页签和跨页导航。 封面例外，使用灰白纸张肌理、红色横线与居中主视觉。 默认顺序固定为封面、全景图、上游、中游、下游； 产业链模板不得跳过中游，也不得用商业模式页替代中游。 主 Agent 需补全各页标题、环节说明、参与主体、流程关系和对应插画主题。 - 可选色板：暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）； 天空蓝珊瑚（#F3F8FC / #FFFFFF / #25364A / #5B8DB8 / #E07A6F / #F2C66D）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
