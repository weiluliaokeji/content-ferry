        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/lifestyle/xhs-daily-schedule-editorial/03.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A02Z%2F-1%2Fhost%2F215f6677030f2f95ccbd5711295afbd312610687ef69d36a60acda722183f596"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，不可重复。 - 用途：以单一情绪画面和两级标题建立系列主题的编辑式封面。 - 布局：整页为一幅连续的满版几何建筑油画，不设留白正文区。主标题位于画面中部偏下，直接叠加在油画背景上；副标题紧随其下，直接叠加在同一背景上。原图没有独立标题框、底条、卡片、标签、图标、图表、列表、按钮、输入区域、页眉、页脚、导航、编号或装饰边框，生成时不得补造这些组件。 - 字体：主标题为一行超大号白色粗黑无衬线中文，笔画厚重、字面宽阔、居中对齐，直接叠加在深色油画区域；副标题为一行较小号白色中细无衬线中文，字符间距明显拉开、居中对齐，直接叠加在主标题下方。页面没有模块标题、正文、标签、数字、图表文字或注释，也没有对应文字容器。 - 组件与填写要求：主 Agent 只需规划一行凝练主标题和一行短副标题，并生成一幅与主题情绪匹配的满版油画式主视觉；两级文字必须落在画面中相对安静、对比足够的区域，不能使用白框、半透明底条、色块或描边容器承载文字。主视觉可以按目标主题替换建筑、室内、风景或静物，但必须保持大色块、粗粝笔触、克制构图和足够的文字叠加空间，不得加入额外信息模块。 - 数量与编号：固定只有1个主标题和1个副标题，不显示条目编号、页码、日期、期号或版本号。 - 内容清理：替换原案例标题和副标题，删除原主题残留；删除 Logo、品牌、作者、账号、水印、二维码、平台 UI、来源声明、固定页码、期号和翻页或发布引导。禁止生成伪文字、占位词、空白文字框或原图不存在的信息组件。
        - description: >-
            - 参考图：模板参考图2，可重复。 - 用途：按时间顺序呈现日程或阶段安排的编辑式正文。 - 布局：页面上约三分之一是一幅横向几何建筑油画，下方为连续白色内容区。内容区纵向排列3组时间段，每组的时间标签和1至2行说明都直接叠加在白底上，组间只留较大垂直间距。原图没有卡片、边框、分隔线、图标、标签底或输入区域。 - 字体：时间标签使用黑色粗体无衬线数字与中文，左对齐；说明使用较小的黑色手写感或人文无衬线中文，左对齐、自然换行。两级文字均直接落在白底上，不使用文字容器。 - 组件与填写要求：填写3组或按内容量调整的起止时间及对应任务说明；各时间段不重叠、不倒序，共同服务同一日程主题。顶部油画可替换为与主题一致的同媒介场景，但不承担额外文字或图标。 - 数量与编号：时间段以真实起止时间标识，不转换为条目序号；跨页时按实际时间顺序继续。 - 内容清理：替换原案例文字、数据和示例视觉；删除 Logo、品牌、作者、账号、人物身份、水印、二维码、平台 UI、来源声明、固定页码、期号、年份版本及翻页或发布引导。图片模板中不得保留可读文字、伪文字、占位词或原图不存在的文字容器。
        - description: >-
            - 参考图：模板参考图3，可重复。 - 用途：连续编号的注意事项或技巧清单正文。 - 布局：顶部油画的高度和位置与上一正文页一致，下方为连续白色内容区。内容区先放一行栏目标题，再纵向排列5条编号事项；标题、编号和长句均直接叠加在白底上，长句自然换行。原图没有卡片、边框、分隔线、图标、标签底或输入区域。 - 字体：栏目标题使用黑色粗体无衬线中文；编号与正文使用较小的黑色手写感或人文无衬线中文，左对齐、宽松行距。所有文字直接落在白底上，不使用文字容器。 - 组件与填写要求：填写栏目标题及本页承接的5条或按可读性调整的注意事项，每条包含一个连续阿拉伯数字和1至2行可执行说明；不添加无关插画或装饰。 - 数量与编号：同一清单跨重复页连续编号；只有明确切换到独立新栏目时才在新作用域从1开始。 - 内容清理：替换原案例文字、数据和示例视觉；删除 Logo、品牌、作者、账号、人物身份、水印、二维码、平台 UI、来源声明、固定页码、期号、年份版本及翻页或发布引导。图片模板中不得保留可读文字、伪文字、占位词或原图不存在的文字容器。
