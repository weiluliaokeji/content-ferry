      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，不可重复。 - 用途：新手指南目录封面。 - 布局：整套封面兼目录。 顶部用中性胶囊短标签替代搜索交互，右上保持纯装饰留白； 中上放超大双色粗描边主标题，下接橙色矩形副标题条； 中下部用六幅或按目录数量调整的卡通插画组成规则网格，每格下方配黄色圆角栏目标签。 无橙色阶段页签，是正文结构的例外。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写主标题、副标题和六个或按内容规划的目录栏目； 每格包含通用宠物或主题插画、栏目名和最多2条极短提示。 顶部胶囊仅作中性栏目提示，不模拟搜索交互； 右上分享箭头必须删除或改为纯装饰留白。 - 数量与编号：封面目录默认不显示序号； 栏目以名称和插画标识。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
