    - id: "xhs-illustrated-niche-atlas"
      description: >-
        适合先给出多类别目录，再逐个展开同一套详情：复古米色图鉴封面以中心人物和放射场景总览全部类别，正文沿用同一分类清单，以中央主插画、左右栏目、勾选清单、标签和数据卡解释每类。 可迁移到职业、兴趣、工具、方法、场景或物种等分类盘点。
      text: >-
        - 模板规则：全套为竖版复古图鉴海报：米色纸张肌理、双线装饰边框、粗黑中文大标题、低饱和花卉和勾选标记。 封面以圆形放射拼贴总览全部分类； 详情页以可填写栏目标题置顶，中心放大人物或主题对象，左右排列信息模块与缩略卡片，右侧设置清单，底部收束标签、工具、场景物件或数据卡。 封面与详情共享同一分类清单； 不复制人物身份、账号、印章文字或发布标记。 抽象化要求：人物必须匿名中性，外围场景和底部物件使用可跨行业迁移的研究、教育、服务、工具、产品、社区与内容生产组件；不得保留美妆、具体职业身份、个人账号或原案例专属物件。 - 可选色板：暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）； 天空蓝珊瑚（#F3F8FC / #FFFFFF / #25364A / #5B8DB8 / #E07A6F / #F2C66D）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
