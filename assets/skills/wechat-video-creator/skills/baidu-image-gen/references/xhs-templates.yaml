    - id: "xhs-daily-schedule-editorial"
      description: >-
        封面以油画建筑和居中文字建立情绪主题，正文将时间段或注意事项放入上图下白底的纵向版式，形成计划到提醒的阅读节奏。灰、赭黄、深绿背景与黑白文字、手写感说明构成编辑化骨架。 可迁移到学习作息、工作安排、旅行日程、训练计划和生活记录。
      text: >-
        - 模板规则：整套采用灰、赭黄与深绿构成的粗粝油画建筑背景，正文统一为白底黑字，无页签、导航、边框或卡片。 封面例外为全幅图像与白色居中文字； 模板参考图1是封面页，参考图2是可重复的时间分段页，参考图3是可重复的注意事项页； 正文保持上约三分之一主题图像、下方白色内容区。 主 Agent 需补全主副标题、3组时间与说明、栏目标题及5条编号内容。 - 可选色板：治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 天空蓝珊瑚（#F3F8FC / #FFFFFF / #25364A / #5B8DB8 / #E07A6F / #F2C66D）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
