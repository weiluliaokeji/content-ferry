        - description: >-
            - 参考图：模板参考图2，不可重复。 - 用途：多对象维度对比表正文。 - 布局：对比表格页。 中央为白色或浅黄色大表格，按功能、适用场景、上手难度等维度并列比较多款工具，四周保留撕纸边缘。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写对比标题、全部比较对象及统一维度； 每列对应一个对象，每行对应一个能力、场景、成本、门槛或限制，单元格给出可比较的短结论。 底部选择建议必须由表格结果推导，不能出现列错位或不同口径。 - 数量与编号：默认不显示可见排名编号； 对象、维度和人群使用名称标识，标题中的数量仅表示实际比较对象总数。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
            - 参考图：模板参考图3，可重复。 - 用途：人群或场景选择指南正文。 - 布局：人群选型页。 白色圆角卡片内按不同人群或工作需求分组，列出推荐工具、适用理由和不适合场景。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写标题及按人群或任务划分的选择组； 每组包含人群/场景名、推荐对象、推荐理由、适合任务和不适合条件，并配一个抽象图标。 各组不重复，底部写一条总选择原则。 - 数量与编号：默认不显示可见排名编号； 对象、维度和人群使用名称标识，标题中的数量仅表示实际比较对象总数。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
            - 参考图：模板参考图4，可重复。 - 用途：产品能力亮点清单正文。 - 布局：能力亮点页。 用三个或四个带图标的横向卡片呈现核心能力、输入输出和一句行动建议。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写能力亮点标题、3至4个能力卡和底部选择建议； 每卡包含能力名、输入、处理动作、输出和适用场景，并配对应图标。 能力卡必须属于同一对象或同一比较维度，不混入无关功能。 - 数量与编号：默认不显示可见排名编号； 对象、维度和人群使用名称标识，标题中的数量仅表示实际比较对象总数。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
    - id: "xhs-ai-agent-selection-editorial"
      description: >-
        适用于多个对象的选型、分类与单项评测，以高密度总览封面、按人群或任务推荐、按能力分类、单对象档案逐层收敛信息。 可迁移到软件、服务、硬件、课程、岗位、方案或工具生态的横向比较，不限定 AI 主题。
      text: >-
        - 模板规则：整套采用明亮珍珠白或浅淡紫背景、近黑粗标题、紫蓝主强调和少量薄荷绿辅助色；使用圆角信息卡、细灰分隔线、清晰编号、扁平线性图标与无文字虚构小角色。封面负责建立对象范围和选择主张，正文依次支持按人群或任务推荐、按能力分类和单对象评测；同一对象跨页保持名称、抽象图标和比较口径一致。 图标要求：真实产品 Logo、公司标识、字母徽章和 App 图标必须替换为无文字的虚构语义图标；可使用抽象小脸、圆角机器人、几何精灵或工具角色。图标之间必须可区分，同一对象跨页必须保持同一外观，不得出现真实或近似品牌标识。 - 可选色板：淡紫青草（#F7F5FB / #FFFFFF / #242536 / #5B5CE2 / #8B6FE8 / #72A58A）；天空紫蓝（#F5F7FC / #FFFFFF / #222538 / #4867E8 / #8A63E8 / #77B5A6）；暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）。整套只选一套，默认优先淡紫青草；深色只用于文字、图标细节和必要对比，不得用于画布四角或大面积背景。
      image_urls:
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/technology/xhs-ai-agent-selection-editorial/01.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2F5523f834c069de62af2245c2f5a68b8fc5c4dd30bb4d89268e6d26f63461301b"
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/technology/xhs-ai-agent-selection-editorial/02.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2Fde711c80f03387c922bb18a33e04cef6a776d7c39a63e1e5c66cd2adf3ca103d"
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/technology/xhs-ai-agent-selection-editorial/03.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2F979542364a0449296465983810bc9e80aaa1d28f13157b71a2795e6d7f67a56b"
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/technology/xhs-ai-agent-selection-editorial/04.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2F81919cea80531a391cedf8b26de7d3ef74e804fa1ce5e283a094c8cd6c8781df"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，不可重复。 - 用途：建立比较对象范围、核心选型问题和整套内容主张的高密度总览封面。 - 布局：顶部约三分之一为直接叠加在明亮背景上的超大对象数量、两行主题标题和一行对象范围副标题，不设置标题白框或输入框；中部是一条独立紫蓝渐变圆角主张横幅，左侧放一枚主视觉图标，右侧放两行对比结论；下部是一个浅色独立总览区，内部按两行等宽网格排列对象卡，参考结构为每行五张，每卡上部是对象图标、下部是名称；最底部是一条独立浅色总结栏，左侧为适用对象图标，中间为一至两行选择提示，右侧为抽象总结插画。不得保留原图右上角年份或版本角标，也不得为直接排在背景上的标题新增容器。 - 字体：数量与主标题使用近黑、超大号、超粗无衬线字，左对齐并形成强烈两级层次，关键词可使用紫蓝强调；副标题为中号粗体无衬线字，黑色为主并允许一个关键短语使用主强调色；主张横幅使用大号粗体白字，左对齐、两行以内；对象名称使用小号至中号半粗无衬线字，居中放在各自卡片下部；底部提示使用中小号常规或半粗无衬线字，左对齐。所有文字都由内容规划填写，不复制原文。 - 组件与填写要求：主 Agent 必须给出实际对象总数、比较主题、对象范围副标题、一个明确的选择主张、完整对象清单、每个对象的中性名称与一枚唯一虚构图标，以及适用对象或决策提醒。可见数量必须等于对象卡实际数量；每张对象卡必须同时填入图标和名称，主张横幅必须同时填入主视觉图标和结论文字，底部图标、提示与总结插画必须表达同一决策含义。不得生成只有边框而没有文字或视觉内容的大空框。 - 数量与编号：对象卡数量由实际对象数决定，参考图为两行五列；数量变化时保持等宽网格和相近密度，可调整列数或增加同类行，但不得留下空卡。封面只显示实际总数，不显示排名编号、固定年份、版本号或页码。 - 内容清理：替换原案例标题、对象名、数字、结论、图标和适用人群；删除真实 Logo、品牌轮廓、作者、账号、水印、二维码、平台 UI、来源声明、年份版本角标、固定页码及翻页或发布引导。全画布必须为连续明亮背景，禁止黑色或透明四角、外层页面框和画布外阴影。
        - description: >-
            - 参考图：模板参考图2，可重复。 - 用途：按用户类型、任务场景或决策条件，把候选对象与推荐理由逐组对应。 - 布局：顶部为直接叠加在背景上的两行超大问题式标题，第二行关键词使用紫蓝强调；正文纵向堆叠同构推荐行，参考结构为六行，每行是独立浅色圆角卡并分成三列：左列包含圆形局部编号、一枚人群或任务图标和组名，中列包含小型“推荐方向”栏名及三至五个候选名称，右列包含一枚理由图标、小型“理由”栏名和两至三行解释；各列用细虚线或留白分隔。底部是一条独立浅紫总结横幅，左侧为星形或目标图标，右侧为一至两行总建议；原图右侧收藏书签属于发布引导，连同其容器完整删除，不得留下空白占位框。 - 字体：主标题使用近黑超粗无衬线字，左对齐，两行排版，关键词使用紫蓝粗体；每组名称使用中大号近黑粗体，居中或左对齐；栏目名使用小号至中号紫蓝半粗体；候选名称与理由正文使用小号常规无衬线字，黑色、左对齐、短行距；底部总结使用大号粗体，关键短语可用紫蓝强调。局部编号使用白色粗数字置于紫蓝实心圆内。 - 组件与填写要求：主 Agent 必须规划每组的用户类型、任务场景或判断条件，一枚对应图标，三至五个推荐对象，以及说明推荐依据的两至三条短理由；每行的对象名单和理由必须一一对应该组，不得跨行复用同一句理由。底部总结必须给出跨组选择原则。人物图标可按主题替换为设备、场景、岗位、需求或抽象任务符号，但每行仍保持一个组图标和一个理由图标。 - 数量与编号：推荐组数量可在四至七组内伸缩，参考图为六组；每组局部编号从 1 连续递增，不代表对象排名，也不接续其他页面。每组候选对象为三至五个，实际数量按内容填写，不得留下空项目符号或空列。 - 内容清理：替换原人群、对象名、推荐理由、图标和总结；删除真实 Logo、品牌、作者、账号、水印、二维码、平台 UI、来源声明、固定页码及收藏、点赞、关注、翻页等发布引导，并删除其专属容器。全画布保持连续明亮背景，禁止黑色或透明四角。
        - description: >-
            - 参考图：模板参考图3，可重复。 - 用途：按能力、用途或工作类型对候选对象重新分类，说明每类适合解决什么问题。 - 布局：顶部为直接叠加在背景上的两行超大结论式标题，关键词使用紫蓝强调；右上角保留一个独立线描气泡，用于填写简短纠偏提醒；标题下方是一条独立浅色导语栏，左侧是灯泡或提示图标，右侧是一至两行分类原则。主体纵向排列四个独立浅色圆角分类卡：每卡左侧窄栏包含紫蓝圆形编号、大号类别图标和类别名称，右侧宽栏上部排列一至五个对象名称胶囊，中部是一行“适用任务”说明，下部排列四个带小图标的能力或场景标签；左右栏由细虚线分隔。主体下方是一条独立结论区，左侧是目标图标与结论标签，右侧用一行大号问题或选择结论收束。原图最底部收藏提示整栏属于发布导航，必须完整删除并用连续背景或自然扩展结论区收口。 - 字体：主标题为近黑超粗无衬线字，左对齐、两行，关键词为紫蓝超粗字；气泡提醒为中号手写感或圆体紫蓝字；导语为中号常规无衬线字，重点短语加粗或着色；类别名称为中大号近黑粗体；对象名称胶囊为小号至中号常规无衬线字、居中；适用任务为中号正文，标签文字为小号常规字；底部结论使用大号粗体，关键动作使用紫蓝强调。局部编号为白色粗数字置于紫蓝实心圆内。 - 组件与填写要求：主 Agent 必须给出分类主题、纠偏提醒、分类原则和四个互斥或清晰区分的类别；每类必须填写类别名称、类别图标、一至五个对象名称、该类适用任务，以及四项带图标的代表能力或使用场景。对象可以跨类出现，但适用任务和能力说明必须随类别改变；每个对象名称胶囊、能力图标和标签都必须填满。底部结论必须明确先按哪一种目标或维度选择。类别图标、能力图标和气泡装饰均可按目标主题替换。 - 数量与编号：类别参考结构固定为四组，内容不足时应更换页面而不是保留空分类卡；每组对象为一至五个，每组能力标签参考为四个。类别编号仅在本页从 1 至 4 连续，不代表对象排名，不接续其他页面。 - 内容清理：替换原标题、类别、对象名、能力、结论、数据和示例图标；删除真实 Logo、品牌、作者、账号、水印、二维码、平台 UI、来源声明、固定页码及收藏、点赞、关注、翻页等发布引导，并删除其整条容器。背景必须铺满画布，禁止黑色或透明四角、外层圆角页面框、露底和外部阴影。
        - description: >-
            - 参考图：模板参考图4，可重复。 - 用途：对一个候选对象做完整档案式评测，说明定位、能力、体验、适用边界和最终建议。 - 布局：顶部为直接叠加在明亮背景上的对象名称和一行定位标题，对象名称使用主强调色；右上角有一个独立线描气泡作为内容类型标签。标题下方是一条横向定位区，左侧为对象虚构主图标，中部为小型定位标签和一至两行概括，右侧可放一枚轻量装饰图标。中上部为独立功能区，先放分区标题，再以两行网格排列功能项，参考结构为首行五项、次行四项，每项由图标和短名称组成。中下部为独立体验区，左侧包含分区标题和三至五行体验说明，右侧是一幅工作场景或结果示意插画。下部为左右并列的“适合”与“不适合”两栏，每栏有状态图标、栏名和三至五条带小图标的对象或场景清单。最底部是一条独立浅色结论横幅，左侧是结论图标，中间为两行行动建议，右侧为趋势或结果插画。原图底部免责声明和话题标签不属于模板内容，必须删除且不保留容器。 - 字体：对象名称使用超大号主强调色粗无衬线字，定位标题使用近黑超大号粗体；气泡标签使用中号手写感或圆体强调色字；分区标题使用中大号近黑粗体并配实心小图标；定位标签使用小号白色半粗字置于强调色胶囊内，概括和体验说明使用中号常规无衬线字、左对齐；功能名称与适用性条目使用小号至中号常规字；底部行动建议使用大号近黑粗体，关键对象或动作使用主强调色。 - 组件与填写要求：主 Agent 必须填写对象名称、定位短句、内容类型标签、一句话理解、完整功能清单、真实体验或评测依据、适合对象、不适合对象和最终行动建议；同时生成一枚全页一致的对象虚构图标、每项功能图标、体验区场景插画、适用性条目图标和结论插画。功能名称与图标必须逐项对应，体验文字必须解释右侧场景，适合与不适合两栏必须使用同一比较维度且不互相矛盾。人物、设备或工作场景不适合目标主题时，可替换为产品结构、流程场景、抽象结果或其他等视觉重量对象，但不得删掉视觉位置。 - 数量与编号：功能项参考为九项，可按实际能力在六至十项内伸缩并保持两行均衡网格；适合与不适合清单各为三至五项。该页不显示排名编号、固定页码、年份或版本号，不得留下空功能格或空清单行。 - 内容清理：替换原对象名、定位、功能、体验、适用性、结论和全部示例视觉；删除真实 Logo、品牌轮廓、作者、账号、水印、二维码、平台 UI、来源声明、免责声明、话题标签、固定页码及翻页或发布引导。全画布必须为连续明亮背景，禁止黑色或透明四角、外层页面框和画布外阴影。
