      description: >-
        适合把复杂主题拆成类型总览、演化过程和概念对照的连续正文，也可按需单独复用其中页型。无独立封面，采用白底深蓝框、红蓝强调、编号卡片、箭头流程和左右对照图。 可迁移到知识分类、技术迭代、政策变化、方法比较等高密度科普。
      text: >-
        - 模板规则：模板提供类型矩阵总览、阶段演化流程、概念对照总结三种正文页面； 全套固定使用白底、深蓝粗外框与浅蓝顶部栏，左上保留【行业分析】栏目名； 主标题均为超大黑体，并以红色数字、关键词或VS图形强调。 正文以深蓝代表起点或一方、红色代表终点或另一方，配粗线边框、扁平图标和黑色项目符号。 主Agent需补全各页标题、编号标签、说明要点、示意图及适配主题的配图。 - 可选色板：天空蓝珊瑚（#F3F8FC / #FFFFFF / #25364A / #5B8DB8 / #E07A6F / #F2C66D）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
