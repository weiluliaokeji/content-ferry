        - description: >-
            - 参考图：模板参考图3，可重复。 - 用途：结构或状态图解正文。 - 布局：健康状态图解页，左上橙色页签切换为“养宠前”。 上方为提问式大标题，中部以一只大型正面卡通宠物为核心，四周分布7组橙色胶囊标签与简短说明，并用橙色虚线折线指向对应部位； 底部左侧另设白色黑框对话气泡，形成提示性高亮。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写阶段标签、提问式标题、中心对象、四周状态或部位标签、每项简短说明及底部提示； 每条虚线必须指向对象上真实对应的位置，标签数量可调但不能交叉错指。 人体或宠物对象不适合主题时可替换为设备、产品、空间或流程中枢，保留中心放射标注结构。 - 数量与编号：部位或状态标签不显示序号； 虚线连接负责对应关系。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
            - 参考图：模板参考图4，可重复。 - 用途：物品准备清单正文。 - 布局：居家准备清单页，左上页签保持“养宠前”。 上方大标题下采用图文混排：左侧放清洁主题卡通插画，右侧和中下部纵向排列4组橙色圆点条目及说明，其中一条用重复短句强化警示； 底部横排6个必备物品小图标，每个下方配橙色圆角名称标签。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写阶段标签、主标题、4组准备事项、每组说明、1幅主题插画，以及底部必备物品的名称与图标； 事项与物品不能重复，警示条只突出确有必要的边界。 顶部胶囊为中性栏目提示，右上不生成分享箭头。 - 数量与编号：准备事项与物品默认不显示连续序号； 如采用编号，只在本页准备清单内连续。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
            - 参考图：模板参考图5，可重复。 - 用途：行动事项清单正文。 - 布局：接领沟通事项页，左上橙色页签切换为“接宠时”。 标题下按从上到下排列5条橙色圆形编号清单，正文含主问题与灰色括注； 右上至中部放一幅手持资料卡的卡通宠物插画，与前3条形成左右分区。 第4条末尾以橙色底线突出关键时长，底部保留第5条长文本。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写阶段标签、主标题、5条或按内容量调整的行动问题、括注或核验标准、主题插画和重点时长或条件； 每个编号条目是独立问题，括注说明如何核验。 顶部胶囊为中性栏目提示，右上不生成分享箭头。 - 数量与编号：行动问题只在本页或同一阶段清单内从1连续； 不接续前面不同阶段的自检编号。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
  health:
    - id: "xhs-exercise-movement-cards"
      description: >-
        把一个操作拆成可跟练的起始与完成两帧：白底粗线人物插画上下分区，彩色器械作视觉锚点，右侧写作用与操作要点，底部给组次、时长或节奏提示；每页可独立或连续编排。 可迁移到健身、拉伸、舞蹈、瑜伽、康复、手工步骤或软件操作演示。
      text: >-
        - 模板规则：整套采用白底黑色粗线人物插画，服装以绿色、黑色块面区分，器械用粉色强调； 标题为粗黑大字，说明为常规黑字。 每页均由一条横线分成上下两个动作状态，无页签、编号、卡片外框或导航。 当前保留一张可重复的独立动作页，不区分封面与正文。 主 Agent 需补全每页的动作名称、作用说明、姿势要点、组次与呼吸提示，并规划两个动作阶段。 - 可选色板：治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 天空蓝珊瑚（#F3F8FC / #FFFFFF / #25364A / #5B8DB8 / #E07A6F / #F2C66D）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
      image_urls:
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/health/xhs-exercise-movement-cards/01.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2F4f48cab8a48176d108d82b7b831b63bdf92df03526d88dbd9fcbc2f6fb8da5d2"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，可重复。 - 用途：用两个连续姿势讲解一个训练动作。 - 布局：白色页面由一条黑色横线分成上下两区。上区左侧为同一运动者持器械的起始姿势，右侧的动作名称与多行作用说明直接叠加在白底上；下区中央偏右为更大的结束姿势，左下的组次和呼吸提示直接叠加在白底上。原图没有标题框、说明卡、圆角容器或导航。 - 字体：动作名称使用大号黑色粗体无衬线中文并左对齐；作用说明、组次和呼吸提示使用较小的黑色常规无衬线中文，左对齐、自然换行。所有文字直接落在白底上。 - 组件与填写要求：填写动作名称、作用说明、起始姿势、结束姿势、运动方向、目标部位、组次或时长和呼吸提示；上下人物必须是同一人、同一服装、同一器械和同一视角。服装完整覆盖肩背与胸部，训练效果只写有依据的表述。 - 数量与编号：固定展示同一动作的2个阶段，默认不显示条目编号；组次和时长属于训练参数。 - 内容清理：替换原案例文字、数据和示例视觉；删除 Logo、品牌、作者、账号、人物身份、水印、二维码、平台 UI、来源声明、固定页码、期号、年份版本及翻页或发布引导。图片模板中不得保留可读文字、伪文字、占位词或原图不存在的文字容器。
    - id: "xhs-nutrition-calorie-atlas"
      description: >-
        将同一主题的条目放进三栏分级图鉴：浅桃背景与黑红描边标题建立入口，绿勾、黄叹号、红叉分别表达推荐、酌量和风险，每项用实物缩略图、名称与单位数值对齐，适合高密度速查。 可迁移到营养热量、护肤成分、药物相互作用、预算等级、装备性能或课程难度分层。
      text: >-
        - 模板规则：使用可重复的营养类别图鉴页，不区分封面与正文。 固定为浅桃色背景、顶部超大黑红描边标题、居中分类签和三栏并列正文； 每栏由状态标题、食物图片、名称及统一口径数值组成。 主 Agent 需补全总标题、类别名、三档建议、每档食物与真实单位数值，一个类别可独立成页。 - 可选色板：奶油黄薄荷（#FFF9E8 / #FFFFFF / #2E3D36 / #E7B84B / #75A99C / #EF8D7A）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
      image_urls:
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/health/xhs-nutrition-calorie-atlas/01.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2Ffd65d647b2016c870f0fc11b6a62fc4d38e02e0c9b6fc2feef87ef393a24b73f"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，可重复。 - 用途：营养类别图鉴正文。 - 布局：同版式分类图鉴页，无独立封面构图。 顶部为整套大标题和居中分类签； 中部至底部三栏各纵排七项，每项由左侧圆角方形图片、右侧名称与单位数值组成。 三栏当前依次高亮“慢碳水”绿勾、“快碳水”黄叹号、“劣质碳水”红叉。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写总标题、营养类别、三档分类名与状态标识； 每档纵向填写食物名称、对应图片、单位数值和必要说明，三栏使用同一单位及口径。 数值需真实可核验，无法确认时不生成具体热量； 绿勾、黄叹号、红叉只表达当前分类标准。 - 数量与编号：不显示条目编号； 三档状态使用名称和状态图标区分，单位数值不是序号。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
    - id: "xhs-nutrition-meal-formula"
      description: >-
        先用总览页讲清组合公式，再用可重复详情页落到每个方案：粉色网格纸与蓝框表格固定层级，蛋白质、碳水、纤维蔬果和脂肪分栏，对象图配数量提示，方案标识驱动不同主题。 可迁移到餐食搭配、训练计划、旅行日程、学习配方、护肤流程、项目资源清单或套餐组合说明。
      text: >-
        - 模板规则：全套采用粉色外框、白色浅网格纸背景、浅粉内容底与蓝色圆角表格线； 标题为超大黑色宋体，说明文字黑红混排，定量提示用蓝底标签，食材以抠图配深灰名称排列，四周使用低对比网格装饰。 模板参考图1是餐食公式总览页，参考图2是可重复的餐次详情页； 两者不是固定最终页号。 详情页先写标题与建议，再按优质蛋白质、优质碳水、维生素纤维排列，末栏随具体餐次主题变化； 主Agent需补全各页建议、选择数量、食材名称与图片、末栏主题。 - 可选色板：奶霜玫瑰（#FFF5F6 / #FFFFFF / #3C2F34 / #D98A9A / #8AA6A3 / #F2C57C）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
