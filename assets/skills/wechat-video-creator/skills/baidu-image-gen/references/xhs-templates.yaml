    - id: "xhs-travel-timeline"
      description: >-
        以单日路线为叙事单元，左侧连续站点节点和交通箭头、中部实景图、右侧说明卡形成从出发到抵达的对应关系。浅粉背景、三列排版、圆角图片与图标化移动信息构成骨架。 可迁移到城市漫游、展会参观、课程日程、项目里程碑和活动流程。
      text: >-
        - 模板规则：当前保留一张可重复的日程正文页，无独立封面。 固定使用浅粉白背景、顶部超大黑体主标题并以红色强调末两字，下方标注Day序号与当日主题。 主体分三列：左侧粉色圆角“第X站”节点及黑色实线、点线箭头和交通时长，中间五张圆角横图，右侧五组浅粉说明卡与带图标的交通文字。 主Agent需补全每日主题、五个站点、移动方式与时长、景点摘要及配图。 若用户指定旅行天数，先建立连续的每日计划。 - 可选色板：奶霜玫瑰（#FFF5F6 / #FFFFFF / #3C2F34 / #D98A9A / #8AA6A3 / #F2C57C）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
      image_urls:
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/travel/xhs-travel-timeline/01.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A02Z%2F-1%2Fhost%2Fad821b5454a893a07bc22450d0ba630ccb610abb3b976284fc55b19001e88a05"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，可重复。 - 用途：单日行程路线正文。 - 布局：Day 1日程页。 顶部为总标题和当日主题； 中部左侧设置5个从第一站至第五站连续编号的粉色节点，箭头旁标注交通方式与时长； 中列纵排5张圆角实景图； 右列对应5组浅粉景点卡，组间插入带图标的移动说明。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写总标题、Day标识、当日主题及按游览顺序排列的站点； 每站包含站内序号、景点名、1张实景图和一句亮点说明，相邻站之间填写交通方式与时长。 站点、图片、说明和移动信息必须逐段对应，路线不能倒序或断链。 - 数量与编号：Day按全局日程顺序递增； 每个Day内部站点从第1站重新开始并连续到当日实际站点数，不能把前一天最后一站接到下一天。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
    - id: "xhs-travel-route-collage"
      description: >-
        先用多站双列拼贴和箭头建立路线总览，再以多图同地点详情页补充全景、主体、细节与氛围视角。满幅摄影、黑白或黑黄描边标题、红色图钉和橙黄交通标注形成强动线。 可迁移到景点攻略、展览动线、门店探访、活动路线和产品巡展。
      text: >-
        - 模板规则：整套采用竖版满幅摄影拼贴，图片多为左右双列且几乎无留白、无独立边框； 标题使用粗体大字与黑白或黑黄描边，地点前配红色图钉。 模板提供路线总览和景点详情两类可重复页面； 路线总览参考图示例为三行六站并以红色箭头、橙黄交通时长串联，详情页为四图拼贴，无页签导航； 默认先呈现逐日路线，再展示重点站点； 主Agent需补全日期标题、站点顺序、交通方式与时长、详情短评及对应图片。 媒体要求：所有照片槽必须使用写实旅行摄影，保留自然相机细节、真实建筑与光线；禁止水彩、漫画、动漫、油画和其他插画化处理。 - 可选色板：天空蓝珊瑚（#F3F8FC / #FFFFFF / #25364A / #5B8DB8 / #E07A6F / #F2C66D）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
      image_urls:
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/travel/xhs-travel-route-collage/01.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A02Z%2F-1%2Fhost%2Ff7e917d1bc6f34b3813a9ed1ca1d46a9509f7693376aefd9f14e949b637741c6"
