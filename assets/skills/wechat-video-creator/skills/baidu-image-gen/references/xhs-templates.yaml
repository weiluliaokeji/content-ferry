        - description: >-
            - 参考图：模板参考图4，可重复。 - 用途：投入产出与重点分析正文。 - 布局：顶部标题与摘要横幅； 上部用柱状/比例图表达“投入—结果”关系； 中部是一行或两行核心任务标签，每个配小图标； 下部为精力分配矩阵，并用方向箭头连接到行动结论。 主 Agent 必须提供真实数据或明确的定性关系、任务标签、行动说明和结论； 原图比例只是结构示例，组件数量和数据项由本页实际内容决定。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写标题、摘要、投入项、产出项、图表口径、核心任务标签、矩阵维度和行动结论； 有可靠数值时标明单位与时间范围，无可靠数值时明确使用定性高低关系，不虚构比例。 每个柱、标签、矩阵格和图标必须能回指同一分析对象。 - 数量与编号：数据值、比例和矩阵坐标不是条目编号； 仅在任务标签本身属于同一连续清单时沿用该清单编号。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
            - 参考图：模板参考图5，可重复。 - 用途：节奏、投入与恢复流程正文。 - 布局：顶部标题和问题引导； 中部为“投入→高价值产出”的对比插画； 下方接一条时间/精力窗口轴； 底部以 3 至 4 个动作卡和一条转化箭头表达中断后的重启、沟通或调整流程。 时间标签、动作数量和结论由本页实际内容决定，适用于需要解释节奏、能量、恢复或转化的主题。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写问题引导、投入与产出两端、时间或精力轴的节点、3至4个恢复动作及最终转化结论； 对比插画分别代表低效状态和目标状态，动作卡写触发条件、动作与结果，不能把示例时长当固定事实。 - 数量与编号：时间值属于时间轴，动作卡若编号只在本页恢复流程内连续，不接到其他页面。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
            - 参考图：模板参考图6，可重复。 - 用途：问题澄清与执行流程正文。 - 布局：顶部用问题/解决方案对比建立主题； 中部虚线大框内排列 3 至 4 张彩色澄清卡，每张含问题标题、短说明和图标； 下部把复杂任务拆成节点并用箭头串联，底部再用时间线/检查点收束到风险处理或验收结论。 主 Agent 补全澄清问题、节点标签、检查标准和风险动作，编号若出现按本页执行流程连续。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写问题、目标状态、3至4个澄清问题、任务节点、检查标准、风险动作和验收结论； 每张澄清卡配语义图标，流程箭头按真实先后连接，底部检查点必须对应上方任务节点而非另起一组无关内容。 - 数量与编号：步骤编号只在本页执行流程内连续； 问题卡与风险卡使用栏目名，不共享同一序列。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
