        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/photography/xhs-camera-ranking-review/01.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2F115985e19e6aade85ba7751edd2049ceccfee85a0c8f55e63ca44fb2f782ddd0"
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/photography/xhs-camera-ranking-review/02.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2Fc04532546eaaed4f52db73fa76b952a7853695155d03b38e2cf5b5462634addf"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，不可重复。 - 用途：设备排行或选购总览封面。 - 布局：全系列选购总览。 顶部为超大紫粉渐变问句标题，下方放置简短英文标识； 主体是黑线勾勒的六层梯形阶梯，由上至下每层横向排列1至6个产品剪影，并附名称与价格。 紫色圆角标签标注各档位或用途，部分同组产品以紫色手绘圈强调。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写选购总标题、副标题、档位或用途标签，以及按同一指标分层的产品名称、图片和价格； 每层产品数量可变化，但层级顺序、比较口径和价格时间点一致。 紫色手绘圈只强调有明确推荐理由的对象，不代表虚构销量。 - 数量与编号：产品按档位和同一评测口径排序，默认以名称与价格标识； 只有用户明确要求排行时才在全局产品清单内连续编号。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
            - 参考图：模板参考图2，可重复。 - 用途：单品评测详情正文。 - 布局：入门档单品详情。 顶部标题居中； 白色主区上半部左侧为大幅产品图和紫色价格，右侧为名称及两列参数。 中部浅紫圆角卡先列“优点”，旁接粉色定位短语，再列“不足”，采用勾叉项目符号。 底部两张等宽人像类样片并排。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写产品名、主图、价格、统一参数、3条左右优点、1至2条不足、定位短语和两张真实样片或授权示意图； 优缺点需与参数和样片对应，样片注明场景而非冒充真实拍摄结果。 - 数量与编号：详情页复用当前产品标识，不产生新的可见编号； 参数数值、价格和组图序号不属于排名编号。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
  relationship:
    - id: "xhs-relationship-advice-pink-cards"
      description: >-
        把建议整理成可收藏的攻略册：照片拼贴封面先给主题和预告，正文以粉色手账大卡承载导语、分隔装饰和连续编号清单，重点句用红字、下划线与勾叉强化，适合一页一主题地扩展。 可迁移到关系沟通、职场协作、家庭规则、旅行攻略、学习计划或消费决策清单。
      text: >-
        - 模板规则：保留封面和可重复的主题清单页。 整套为温柔手账风：正文使用粉色背景、居中浅色大卡、白色弧线涂鸦、红色手写大标题和深棕正文，重点以红字、彩色下划线、花藤、星星、对勾或叉号标记。 封面采用主题图拼贴和大字贴纸，正文使用蓝灰方块编号。 页面无固定页签、发布提示或导航； 主 Agent 需补全总标题、内容预告、各页主题、导语和建议条目。 - 可选色板：奶霜玫瑰（#FFF5F6 / #FFFFFF / #3C2F34 / #D98A9A / #8AA6A3 / #F2C57C）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
      image_urls:
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/relationship/xhs-relationship-advice-pink-cards/01.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2Fdb64d12c02f54dd03a85afeb277fa759e7e257d488ebe123025495d8b90bbeed"
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/relationship/xhs-relationship-advice-pink-cards/02.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2F3289f1cec9a940285f18064586791afe6b3e665c7e61c5a76c7e26e1041a80f6"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，不可重复。 - 用途：用同一组人物的上下照片拼贴建立关系主题封面。 - 布局：同一对匿名人物的真实生活照片在上半部和下半部重复出现并铺满画面；中部横跨一条原图自带的半透明白色笔刷带，主标题和引导语直接叠加其上。左上有白色爱心涂鸦，左下3条内容预告直接斜排在照片上；右下发布提示必须删除并恢复照片。原图没有照片框、人物剪影框、建议卡或底部标签卡。 - 字体：主标题使用超大红黑手写描边中文并居中置于白色笔刷带；引导语使用较小白色或黑色手写字；左下预告使用小号白色手写描边字并斜排。文字均直接落在照片或原有笔刷带上。 - 组件与填写要求：填写引导语、主标题和3条内容预告；生成同一对虚构、不可识别的成年人物及上下两张一致的生活照片，人物关系、服装和光线保持一致。爱心只作装饰，不生成收藏、点赞或关注动作。 - 数量与编号：封面无可见编号。 - 内容清理：替换原案例文字、数据和示例视觉；删除 Logo、品牌、作者、账号、人物身份、水印、二维码、平台 UI、来源声明、固定页码、期号、年份版本及翻页或发布引导。图片模板中不得保留可读文字、伪文字、占位词或原图不存在的文字容器。
        - description: >-
            - 参考图：模板参考图2，可重复。 - 用途：关系建议清单正文。 - 布局：首个正文主题页，粉色背景中央放置纵向浅色卡片，顶部大标题配锁形图标和波浪线。 卡片上半部为三行导语，关键短语用红色强调； 花藤横向分隔后出现小栏目名，下方纵向排列7条编号建议，部分条目附彩色下划线、对勾或叉号。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写主题标题、锁形或等义图标、3行导语、栏目名和本页承接的建议条目； 每条包含连续编号、可执行建议和必要的强调词，对勾、叉号或下划线必须表达明确正误或重点，不能随机装饰。 - 数量与编号：同一建议清单跨重复正文页连续编号； 若切换到明确独立的新主题，则在该主题作用域内重新从1开始。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
  parenting:
    - id: "xhs-parenting-age-activity-cards"
      description: >-
        按连续阶段把观察与行动放在同一张双卡里：绿色粗框、上下两段分别呈现阶段表现、训练步骤和对应物品图，读者能同时看发展信号与可执行活动。 可迁移到月龄早教、健身阶段、语言学习进阶、宠物训练、康复计划或技能成长路线，阶段标签只是内容索引。
      text: >-
        - 模板规则：使用可重复的年龄或阶段正文卡，无独立封面或导航。 每页通常承接两个相邻阶段，最后只剩一个阶段时重排为完整单卡，不复制阶段或补无关内容。 固定为绿色粗外框、白底、黑色粗体阶段标题，上下两卡由黑色点线分隔； 每卡包含“应该会”“可能会”“早教或训练方案”及物品图和名称。 主 Agent 需保证相邻阶段内容递进。 - 可选色板：治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 天空蓝珊瑚（#F3F8FC / #FFFFFF / #25364A / #5B8DB8 / #E07A6F / #F2C66D）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
      image_urls:
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/parenting/xhs-parenting-age-activity-cards/01.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2Fa81d90cc6f7bc86b3672a2546da87a432aeca1299d387283a0fa1691286e3b3b"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，可重复。 - 用途：年龄或阶段分组正文。 - 布局：连续月龄内容的起始页，并非独立封面。 上半卡为一月龄，下半卡为二月龄； 每卡左侧各有3条对勾清单和2条方块清单，右侧分别排列4步、3步方案。 上卡底部并列2张物品图，下卡1张，均在右下接点线名称框。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：为每个相邻年龄或阶段填写阶段名、“应该会”能力、“可能会”表现、早教或训练步骤，以及对应物品图和名称； 上下两卡字段完全一致，内容按年龄递进而非重复。 单页只剩一个阶段时重排为完整单卡，不保留空的第二卡。 - 数量与编号：年龄或阶段名是实体标识，不转换成全局条目编号； 每个阶段内部的训练步骤从1局部连续。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
    - id: "xhs-parent-child-focus-games"
      description: >-
        用一个个互动项目解释怎么玩、怎么加难、练到什么：封面以手写涂鸦建立主题，正文循环编号标题、居中玩法说明和紫粉能力总结，荧光笔标出口令与关键动作，适合连续发布。 可迁移到亲子游戏、团队破冰、课堂活动、语言练习、康复训练、家庭任务或产品教程。
      text: >-
        - 模板规则：当前保留封面和一张可重复的项目方法页。 全套使用灰米色粗糙纸张背景、深蓝手写字、黑线彩色涂鸦及橙黄绿蓝粉荧光笔式标记。 顶部固定一枚居中人物插画，底部固定左右贴纸、中央装饰带。 封面例外：无编号栏目，以多行超大标题居中； 正文按项目数量连续编号，并循环复用 活动方法页的橙色编号标题、居中说明和紫粉色能力总结结构。 主Agent需补全总主题、项目名称、玩法说明、强调词、能力总结。 - 可选色板：奶油黄薄荷（#FFF9E8 / #FFFFFF / #2E3D36 / #E7B84B / #75A99C / #EF8D7A）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
      image_urls:
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/parenting/xhs-parent-child-focus-games/01.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2F0f93d7141b07f7568c9e6f63dc64c751c33dfbef9579d42778c501be20a7e8f8"
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/parenting/xhs-parent-child-focus-games/02.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2F70db94499ff098483dc49a5278bb06b414c10f70296efa5510ece91c812d9c3d"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，不可重复。 - 用途：以手写涂鸦建立活动方法系列封面。 - 布局：灰米色粗糙纸张上，顶部居中放1枚人物涂鸦；中部约5行超大手写标题直接叠加在纸张上，个别关键词后方保留原图已有的橙色、粉色虚线块或蓝色笔刷强调；底部左右放贴纸，中央是小装饰带和短副标题。原图没有标题框、正文卡、输入线或列表容器。 - 字体：主标题使用超大深蓝手写描边中文，居中、行距紧凑；强调词沿用同一字形并叠加彩色强调；底部副标题使用很小的深色手写字并居中。所有文字直接落在纸张或原有强调色上。 - 组件与填写要求：填写多行总标题和1句短副标题；顶部人物与底部贴纸可按主题替换为同笔触通用装饰，强调色只标记1至2个关键词，不能画成伪文字或额外信息模块。 - 数量与编号：封面不显示活动编号或固定项目数量。 - 内容清理：替换原案例文字、数据和示例视觉；删除 Logo、品牌、作者、账号、人物身份、水印、二维码、平台 UI、来源声明、固定页码、期号、年份版本及翻页或发布引导。图片模板中不得保留可读文字、伪文字、占位词或原图不存在的文字容器。
        - description: >-
            - 参考图：模板参考图2，可重复。 - 用途：说明一个具体活动的玩法、加难方式和训练目标。 - 布局：灰米色粗糙纸张上，顶部居中放1枚人物涂鸦；其下的活动编号与名称直接叠加在橙色笔刷强调上，中部约6行玩法说明直接叠加在纸张上，少量关键词使用黄、蓝笔刷或粉色块状下划线；下部单独放1行紫粉色能力总结，底部贴纸装饰固定。原图没有文字框、卡片、输入线或列表容器。 - 字体：编号和活动名使用大号深蓝手写描边中文；玩法说明使用中号深蓝手写字、居中分行；能力总结使用较小紫粉色手写字。文字直接落在纸张或原有强调笔刷上。 - 组件与填写要求：填写连续活动编号、活动名称、约6行玩法说明、口令或示例、加难方式和能力总结；人物动作与玩法一致，强调色只标记关键词。每页只讲1个活动。 - 数量与编号：同一活动合集跨重复页连续编号，不重复、不跳号；每页只消费1个活动编号。 - 内容清理：替换原案例文字、数据和示例视觉；删除 Logo、品牌、作者、账号、人物身份、水印、二维码、平台 UI、来源声明、固定页码、期号、年份版本及翻页或发布引导。图片模板中不得保留可读文字、伪文字、占位词或原图不存在的文字容器。
  pet:
    - id: "xhs-pet-food-safety-grid"
      description: >-
        把大量对象判断压缩成一张可扫描的三态速查网格：黄色方格边框、顶部绿勾黄叹号红叉图例、红色栏目条分组，五列插画与名称逐项对应，底部保留警示语。 可迁移到宠物食物、药品禁忌、儿童零食、过敏原、植物识别、护肤成分或旅行风险清单。
      text: >-
        - 模板规则：当前保留一张可重复的食物安全网格页。 全套采用黄色方格外框、白色内容底板、顶部三态图例、超大蓝色描边标题与金色花纹分隔线； 栏目以红色刷痕标签配蓝色说明，条目均为插画加粗黑名称，并用红色禁用、橙色慎用、绿色可用图标标记。 各页固定五列网格、右上圆形宠物头像、底部保留橙色警示语，右下保持干净。 该页不是独立封面； 多个类别按顺序循环复用同一网格结构。 主Agent需补全总标题、栏目、说明、条目、状态、插画及警示文案。 - 可选色板：奶油黄薄荷（#FFF9E8 / #FFFFFF / #2E3D36 / #E7B84B / #75A99C / #EF8D7A）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
      image_urls:
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/pet/xhs-pet-food-safety-grid/01.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2F08b9c70c387ae81afcc35a60d391b2372810ebf08157fd720eb33ac9a0476271"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，可重复。 - 用途：食品安全速查表正文。 - 布局：整套速查表的首图兼综合导览页。 顶部为三态图例、巨幅蓝色标题和花纹线； 中部上下设置两个红色栏目条，各配一段蓝色说明，栏目下均以两行五列排列10个插画条目，三种状态混合出现； 右上放圆形宠物头像，底部为警示语，右下保持干净留白。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写总标题、三态图例、两个或按内容量调整的食品栏目、栏目说明、各条目的名称、状态和插画，以及底部安全警示； 每个条目只使用一种状态，名称、图标状态和插画逐项对应。 右上宠物头像是可替换的主题对象，不需要人物或账号信息。 - 数量与编号：不设置可见条目编号； 红禁用、橙慎用、绿可用是状态标识，不是序号。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
    - id: "xhs-pet-new-owner-checklist"
      description: >-
        以新手流程为主线组织目录、事前自检、状态观察、用品准备和交接问询：封面用插画目录，正文用阶段页签、橙色编号清单、中心对象图解和物品卡，既能讲步骤也能做结构或状态标注。 可迁移到宠物、设备、产品、居家准备与其他新手指南。
      text: >-
        - 模板规则：全套采用浅黄色方格背景、米白圆角内容板、黑色粗描边标题与橙色强调，搭配手绘卡通对象。 正文保留左上阶段页签、顶部中性栏目提示、左下小插画和底部提示； 禁止模拟搜索、分享、收藏或其他发布动作。 封面例外，不设阶段页签，改用插画目录。 页面可承担自检清单、中心对象图解、用品准备和行动问询，主 Agent 需补全标题、条目、注释、标签和对应插画。 - 可选色板：杏仁蓝（#FFF7EE / #FFFFFF / #2E3440 / #D9825B / #5E88A6 / #91B89A）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
