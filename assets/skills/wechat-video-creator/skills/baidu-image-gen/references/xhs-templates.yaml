      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，可重复。 - 用途：路线总览拼贴正文。 - 布局：首日路线总览。 全页为三行两列共六张满幅景点照片； 超大日期标题直接叠加在顶部两张照片上，不设标题框或底板。 每格底部的图钉与白字黑描边站名直接叠加在照片上，也不设独立标签框。 相邻站点以红色横向或斜向箭头连接，橙黄黑描边的交通方式和时长直接沿箭头叠加，形成自上而下的连续动线。 除照片分格外没有白框、卡片、底条或其他文字容器。 - 字体：日期标题为超大、粗重、圆润的黑色展示字，带厚白描边，居中跨两列直接压在照片上； 站名为大号粗黑无衬线中文，白色填充、黑色粗描边，靠近对应图钉直接叠加； 交通文字为中大号粗体斜向或横向排列，黄色至橙色填充、红色描边，沿路线箭头直接叠加。 所有文字均无独立底板，具体内容由规划填写，不复制原文。 - 组件与填写要求：填写日期或日程标题、按路线顺序排列的站点名、每站实景图，以及相邻站之间的交通方式和时长； 图钉落在对应照片内，箭头按自上而下阅读顺序形成唯一连续动线。 - 数量与编号：不设置可见条目编号； 日期和交通时长是内容值，站点顺序由路线箭头表达。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
            - 参考图：模板参考图2，可重复。 - 用途：单一地点特色详情正文。 - 布局：重点站点详情页，无日期标题和路线箭头。 全页四张照片按两行两列等宽满版拼接； 横向中轴的图钉与站点名直接叠加在照片上，不设标题框。 站点名下方仅保留原图真实存在的两条窄幅半透明白色短评底条，除此之外不得增加任何白框、标签或文字容器。 四张图围绕同一站点选择全景、主体、细节和氛围等不同视角。 - 字体：站点名为超大粗体中文，浅黄色填充、黑色粗描边，配一个红色图钉并直接叠加在四图中轴； 短评为两行大号常规黑色无衬线中文，每行分别居中放入一条半透明白色底条。 无其他文字层级或文字容器，具体文字由内容规划填写，不复制原文。 - 组件与填写要求：填写一个重点地点名称和1至2行短评； 四个照片位只展示该地点的全景、主体、细节和氛围，不再写路线箭头或其他站点名，照片视角互补且不能重复。 - 数量与编号：不设置可见条目编号； 日期和交通时长是内容值，站点顺序由路线箭头表达。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
            - 参考图：模板参考图3，可重复。 - 用途：单一地点多视角拼贴正文。 - 布局：另一重点站点详情页，采用两行两列四图满版拼贴。 中央接缝处的图钉和站点名直接叠加在照片上，不设标题框； 其下仅保留原图真实存在的两条窄幅半透明白色短评底条，除此之外不得增加白框、标签或文字容器。 四张图片仍需属于同一地点，并通过主体景观、入口、局部细节和环境视角形成互补。 - 字体：站点名为超大粗体中文，浅黄色填充、黑色粗描边，配一个红色图钉并直接叠加在四图中轴； 短评为两行大号常规黑色无衬线中文，每行分别居中放入一条半透明白色底条。 无其他文字层级或文字容器，具体文字由内容规划填写，不复制原文。 - 组件与填写要求：填写一个重点地点名称和1至2行短评； 四格分别展示主体景观、入口或路径、局部细节和周边环境，所有画面属于同一地点。 中央标题只出现一次，不为每格另造地点。 - 数量与编号：不设置可见条目编号； 日期和交通时长是内容值，站点顺序由路线箭头表达。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
            - 参考图：模板参考图4，可重复。 - 用途：氛围与总结拼贴正文。 - 布局：第三个重点站点详情页，同样使用两行两列四图满版拼贴。 中央接缝处的图钉和站点名直接叠加在照片上，不设标题框； 下方仅保留原图真实存在的一条窄幅半透明白色短评底条，除此之外不得增加白框、标签或文字容器。 四张图统一在同一时段或色调下，分别展示远景、主体、局部与环境，使整页色彩连贯但视角不重复。 - 字体：站点名为超大粗体中文，浅黄色填充、黑色粗描边，配一个红色图钉并直接叠加在四图中轴； 总结短评为一行大号常规黑色无衬线中文，居中放入唯一一条半透明白色底条。 无其他文字层级或文字容器，具体文字由内容规划填写，不复制原文。 - 组件与填写要求：填写一个重点地点名称和一句总结短评； 四格在同一时段或统一色调下展示远景、主体、局部和环境，保持同一地点身份。 该页可作氛围收束，但不得出现发布、收藏或下一页提示。 - 数量与编号：不设置可见条目编号； 日期和交通时长是内容值，站点顺序由路线箭头表达。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
    - id: "xhs-travel-illustrated-map-cards"
      description: >-
        以手绘地图封面建立地域总览，详情页用编号卡片矩阵拆解地点、位置、插画、价格、时长和亮点，底部补充餐饮、交通与贴士。暖米纸张、粗黑描边、红橙标题和蓝绿插画形成手账骨架。 可迁移到城市指南、园区导览、展馆地图、商圈清单和主题资源图鉴。
      text: >-
        - 模板规则：整套采用复古漫画旅行手账风：暖米色纸张、粗黑手绘字、不规则黑色描边、红橙标题强调、蓝绿风景插画及图标化信息。 模板参考图1是独立地图封面页，无编号卡片； 模板提供一张可重复的目的地详情参考图； 同一地点清单在重复详情页中连续编号，不按页重置。 主Agent需补全主题标题、12项地点资料、配图及三类补充信息。 - 可选色板：奶油黄薄荷（#FFF9E8 / #FFFFFF / #2E3D36 / #E7B84B / #75A99C / #EF8D7A）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
      image_urls:
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/travel/xhs-travel-illustrated-map-cards/01.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A02Z%2F-1%2Fhost%2F01eeb0efc5e2267376076f8024989210ae79e7b23bfe707f1efc6c52504b497e"
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/travel/xhs-travel-illustrated-map-cards/02.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A02Z%2F-1%2Fhost%2F3a85bb22be170a0473ec6ce9f473e94f293002e8b05a2cf9cc3c7f7c526fc0e3"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，不可重复。 - 用途：用高密度手绘地图概括一个地区或主题范围的总览封面。 - 布局：复古米色手账纸上，顶部主标题、短副标题与小徽章直接叠加在背景；中部以1个大范围地图轮廓为主体，内部铺满分区色块、地点标签位置和代表性地标插画，四周穿插交通工具、云朵与方向标；底部保留离岛或补充区域、装备组和木牌式装饰。仅木牌等原图真实存在的图形可作为独立容器，不新增地点卡、编号框或伪文字线。 - 字体：主标题使用超大黑色粗手写中文并配红橙强调，居中；副标题、地点名和底部短句使用较小黑色手写字，部分位于原有木牌或徽章内，其余直接落在纸张或地图上。文字层级紧凑但清晰。 - 组件与填写要求：填写主标题、副标题、地图覆盖范围、核心地点和底部旅行主张；为每个地点生成对应地标插画并放在语义正确的地图位置，交通、云朵、方向标和装备仅作辅助。地标可按主题替换为虚构通用目的地，不保留真实品牌或账号。 - 数量与编号：封面不显示1至12条目编号；地点只以名称和位置识别。 - 内容清理：替换原案例文字、数据和示例视觉；删除 Logo、品牌、作者、账号、人物身份、水印、二维码、平台 UI、来源声明、固定页码、期号、年份版本及翻页或发布引导。图片模板中不得保留可读文字、伪文字、占位词或原图不存在的文字容器。
        - description: >-
            - 参考图：模板参考图2，可重复。 - 用途：目的地或对象卡片攻略正文。 - 布局：目的地攻略参考页。 左上约四分之一为大标题、短标签、人物与地标主视觉； 其右横排1—3号卡，中段四列排4—7号，下一行五列排8—12号。 每卡含名称、位置、横幅插画及票价、开放时间、建议时长、亮点四行。 底部从左至右为旅行小贴士、美食推荐、交通指南。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写页面标题、短标签与人物或地标主视觉； 为每个目的地卡填写连续编号、名称、位置、代表插画、票价或成本、开放时间、建议时长和一句亮点。 底部三栏分别填写实用提示、饮食推荐和交通指南，不能用同一内容重复占位。 - 数量与编号：同一目的地清单的可见编号跨重复详情页连续、不重复、不跳号； 底部提示、美食和交通栏目不占目的地编号。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
