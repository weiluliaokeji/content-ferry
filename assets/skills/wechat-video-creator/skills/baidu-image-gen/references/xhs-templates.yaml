    - id: "xhs-tier-ladder-infographic"
      description: >-
        以自下而上的连续阶梯表达能力、阶段或价值递进，左侧节点概括低中高阶段，右侧每级配标签、短说明和图标。暖米背景、彩色立体圆角阶梯、虚线连接与上升箭头构成主骨架。 可迁移到成长路径、课程等级、产品成熟度、风险分层和服务权益。
      text: >-
        - 模板规则：单页信息图模板，无独立封面与正文之分。 固定采用暖米色渐变背景、深色粗体大标题与居中副标题； 主体为自下而上编号1—12的十二层圆角立体阶梯，各层使用不同渐变色，左侧圆形编号、中央层级名称与简述、右端独立浅色图标区。 左侧设置三组圆形图标注释，以虚线节点和上升箭头对应阶段区间。 主 Agent 需补全标题、副标题、十二层名称与短说明，以及三组阶段总结和匹配图标。 - 可选色板：奶油黄薄荷（#FFF9E8 / #FFFFFF / #2E3D36 / #E7B84B / #75A99C / #EF8D7A）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
