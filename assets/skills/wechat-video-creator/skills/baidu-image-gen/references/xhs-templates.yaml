      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，不可重复。 - 用途：方法框架总览封面。 - 布局：暖白纸张封面：顶部两行超大主标题和可选副标题； 中部一幅主题主插画； 主插画四周以弧形虚线/短箭头连接 3 个以上彩色摘要标签，每个标签配一个语义图标或小插画； 底部只保留短摘要或适用范围。 标签数量由实际需要概括的内容单元决定，四个只是原图示例； 封面不放正文长段落、固定页码或发布引导。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写主标题、可选副标题、中心主题和底部一句结论； 为每个摘要单元填写短标签、1条说明及对应语义图标，箭头只表达摘要与中心主题的真实关系。 标签按内容量增减，中心插画中的人物、器官或物件只是可替换的小组件：不适合主题时换成更贴切的对象、流程中枢或抽象隐喻，不必更换整页模板。 - 数量与编号：本页不设可见编号； 摘要标签按阅读顺序排列但不显示序号。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
            - 参考图：模板参考图2，可重复。 - 用途：步骤与检查点流程正文。 - 布局：顶部大标题，下方一条彩色摘要横幅； 上部左右为 2 至 3 个主题图标/场景插画； 中部为 2 至 5 个横向椭圆检查点，按左到右由箭头连接，每个含短标题和一行说明； 下方为醒目提醒条与 2 至 4 个缓冲/应变卡片。 主 Agent 为每个检查点填写可执行动作、判断标准和对应图标，实际内容量决定数量，不能留下未填椭圆或箭头。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写页面标题、摘要横幅、检查点名称、每点的动作与判断标准、提醒结论及缓冲方案； 每个检查点与一个图标、一条箭头一一对应，缓冲卡写触发条件和应对动作，不能只填泛化口号。 - 数量与编号：检查点若显示序号，只在本页流程内从1连续到实际检查点数； 缓冲卡不沿用该序号。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
