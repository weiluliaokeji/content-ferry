  photography:
    - id: "xhs-camera-ranking-review"
      description: >-
        用档位阶梯总览和单项评测帮助读者先定位预算或等级，再核对具体对象：总览以多层梯形、用途标签和价格排位，详情卡以对象图与参数、优点与不足、两张体验图组成闭环。 可迁移到相机、手机、镜头、耳机、运动装备、家电或软件套餐的分档推荐与评测。
      text: >-
        - 模板规则：整套采用浅薰衣草背景、白色内容区、紫粉渐变描边大标题、黑色粗体正文与紫色强调。 总览页用分层阶梯展示统一口径下的档位、产品和价格； 可重复详情页固定展示产品图、价格、参数、优点、不足、定位短语和两张样片。 总览与详情共用同一产品清单，主 Agent 需保证名称、价格、参数、结论和样片逐项对应。 - 可选色板：淡紫青草（#F7F5FB / #FFFFFF / #2F3045 / #8176B5 / #73A580 / #E7C66A）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
