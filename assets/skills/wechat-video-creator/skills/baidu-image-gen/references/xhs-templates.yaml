      description: >-
        封面用多行分类矩阵建立内容索引，详情页以分类标题统领若干对象的封面图、名称与短评，青色横线维持条目节奏，形成总览到分组点评的关系。白底、黑粗字、黄色栏目签和青色分隔线构成清晰骨架。 可迁移到书单、课程资源、电影清单、工具推荐、产品测评和资料目录。
      text: >-
        - 模板规则：保留分类总览和可重复的分类详情两类页面。 全套为白底、黑色粗标题与黑色正文，栏目标题置于黄色矩形底，条目以青色细横线分隔，无外框。 总览只做分类与书目索引； 详情页按单一分类展示书封、书名和短评。 主 Agent 需保证总览分类、书目与详情一一对应，用户只要详情时不自动增加总览。 - 可选色板：天空蓝珊瑚（#F3F8FC / #FFFFFF / #25364A / #5B8DB8 / #E07A6F / #F2C66D）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
