templates:
  general:
    - id: "xhs-sop-framework-cards"
      description: >-
        以一张总览封面和多张方法正文，把复杂主题拆成“目标/准备—分类或判断—执行动作—场景应用—记录复盘”的可执行框架；纸张肌理、手绘插画、彩色标签、流程箭头、矩阵和信息卡共同组成高信息密度的编辑式教程。可迁移到时间管理、学习计划、项目 SOP、产品使用、健身训练、旅行准备、生活整理等，不限定原案例主题。
      text: >-
        - 模板规则：系列统一使用明亮暖白纸张底（优先 #F7F3EA），深灰近黑文字，低饱和鼠尾草绿、珊瑚粉、芥末黄和浅蓝作为功能色； 保留轻微纸张边缘、手绘线条、虚线圆角框、短箭头、贴纸式标签和扁平手绘图标。 标题层级、页边距、插画笔触、线宽和卡片圆角在全系列保持一致； 禁止大面积黑底、霓虹、照片水印和发布导航。 封面只做主题入口和摘要； 正文按语义选择准备/计划、分类矩阵、比例或因果分析、澄清与执行流程、场景清单、批量处理、信息记录、复盘闭环等页面用途。 每页必须补齐短标题、短说明、对应的通用图标或小插画、必要的数据关系和结论，不把原图中的时间、比例、数量或案例名当成固定事实。 只有页面确实有编号槽位时才显示编号。 - 可选色板：暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）； 天空蓝珊瑚（#F3F8FC / #FFFFFF / #25364A / #5B8DB8 / #E07A6F / #F2C66D）。
