      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，不可重复。 - 用途：分组书单总览封面。 - 布局：书单封面总览。 顶部为超大号黑体总标题； 中下部纵向排列4个分类行，每行左侧是黄色分类标签，右侧横排4张书封及其下方书名，行底设青色横线。 四行结构相同，不出现短评正文或顶部栏目签。 - 字体：主标题使用原参考图同等级的醒目中文标题字形；分区标题与标签使用清晰的中等字重无衬线中文；正文、注释、数字和图表文字使用高可读性常规无衬线中文。保持原槽位的相对字号层级、字重、颜色、对齐和留白，所有具体文字由内容规划填写，不复制参考图文字。 - 组件与填写要求：填写书单总标题和分类名称； 每个分类行放同组书籍的封面与书名，分类、封面、书名三者逐项对应。 封面只作总览索引，不写长评； 书封可使用真实且获准的封面素材，无法确认时用通用书籍插画，不伪造作者或出版社。 - 数量与编号：默认不显示可见序号； 分类名、书名和书封共同标识条目。 用户明确要求排行时，才在同一排行作用域内连续编号。 - 内容清理：参考图中的案例文字、占位词、示例数字、示例图片和发布元素必须替换或删除； 未经用户明确允许的 Logo、图形商标、作者、账号、人物身份、水印、二维码、平台 ID、期号、年份版本、固定页码、搜索/分享/收藏/点赞/关注提示和翻页引导不得复制、改写或虚构替代。
        - description: >-
            - 参考图：模板参考图2，可重复。 - 用途：呈现单一分类下的书目或对象详情与短评。 - 布局：白色背景顶部居中放一枚独立黄色矩形栏目底；下方纵向排列4条书目，每条左侧是一张独立竖版封面，右侧的书名和多行短评直接叠加在白底上。条目之间及页面末尾使用青色细横线分隔，原图没有正文卡片、文字框、标签底或伪文字横线。 - 字体：栏目标题为黑色粗体中文并置于黄色矩形内；书名使用黑色中等字重无衬线中文，短评使用更小的黑色常规无衬线中文，均左对齐并直接落在白底上。 - 组件与填写要求：填写1个分类标题和4条或按内容量调整的书目；每条包含封面、书名和一段说明主题、适用人群或阅读价值的短评。封面可替换为获准素材或通用书籍插画，不能伪造作者、出版社或认证信息。 - 数量与编号：默认不显示可见编号；只有用户明确要求排行时才在同一排行作用域内连续编号。 - 内容清理：替换原案例文字、数据和示例视觉；删除 Logo、品牌、作者、账号、人物身份、水印、二维码、平台 UI、来源声明、固定页码、期号、年份版本及翻页或发布引导。图片模板中不得保留可读文字、伪文字、占位词或原图不存在的文字容器。
    - id: "xhs-knowledge-mini-course"
      description: >-
        以学习路径封面、分层路线图和实战/进阶正文，把一个知识主题组织成由浅入深的课程地图；大标题、圆形路径节点、横向分区、手绘知识图标和黑色细线构成讲义式信息图。可迁移到金融、AI 工具、软件上手、职业技能、考试备考和任何需要“入门—工具—实战—进阶”递进解释的知识主题，不限定原金融案例。
      text: >-
        - 模板规则：使用明亮奶油纸底（#F7F3EA 或 #FFF9E8）、黑色粗标题、深灰细线和低饱和蓝/绿/珊瑚/黄色手绘图标； 保留轻纸张质感、圆形路线节点、薄箭头和大面积清晰留白。 全套标题字重、线条粗细、图标笔触、边距和分区框一致； 不使用黑底促销风、品牌水印、账号和版权标识。 封面负责主题入口与学习顺序； 路径页负责层级和先后关系； 正文页负责每个层级的知识点、工具、练习、风险边界和下一步建议。 金融只是原案例，运行时必须根据用户主题替换所有术语、图标和示例； 每个视觉图标都要对应一个具体概念或动作。 不得把页码、版本号或水印当作课程序号。 - 可选色板：暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）； 天空蓝珊瑚（#F3F8FC / #FFFFFF / #25364A / #5B8DB8 / #E07A6F / #F2C66D）。
