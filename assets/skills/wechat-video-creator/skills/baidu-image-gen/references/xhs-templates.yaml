        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/business/xhs-illustrated-niche-atlas/01.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A02Z%2F-1%2Fhost%2F001a67b6f72833e332d61160fbc1ef377ea0d8ed48a0b400f286f4480fde0430"
        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/business/xhs-illustrated-niche-atlas/02.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A02Z%2F-1%2Fhost%2F0fb74f5178a1b78c0236708b7bcc55c74df640051294357f353962e956d891e5"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，不可重复。 - 用途：以高密度复古拼贴概括多个分类或赛道的总览封面。 - 布局：米色纸张和双线装饰边框内，顶部两行超大主标题、短副标题及右上辅助小字均直接叠加在背景上；中下部以1个匿名中心人物或主题对象为视觉核心，外围按放射关系密集分布多个不同场景、工具、产品和服务物件，底部继续铺陈较大的主题对象。原图没有独立标题框、分类卡、编号栏或文字占位容器。 - 字体：主标题使用超大黑色粗体中文，紧凑行距、居中；副标题和右上辅助字使用小号黑色或棕色常规无衬线中文。所有文字直接落在纸张背景上，不使用底条或卡片。 - 组件与填写要求：填写总标题、副标题和可选辅助标签；规划1个匿名中性视觉核心及覆盖研究、教育、服务、工具、产品、社区、内容生产等方向的外围组件。所有人物、职业和物件均可按主题替换，但保持原数量级、尺度层级、放射关系与视觉密度；不得保留美妆、具体职业身份或个人案例残留。 - 数量与编号：封面不显示分类编号；外围组件共同概括全局分类清单，但不逐项写长说明。 - 内容清理：替换原案例文字、数据和示例视觉；删除 Logo、品牌、作者、账号、人物身份、水印、二维码、平台 UI、来源声明、固定页码、期号、年份版本及翻页或发布引导。图片模板中不得保留可读文字、伪文字、占位词或原图不存在的文字容器。
        - description: >-
            - 参考图：模板参考图2，可重复。 - 用途：拆解一个分类或赛道的定位、内容、工具与执行要点。 - 布局：米色纸张和双线花卉边框内，顶部主标题、两侧小栏目名及辅助说明均直接叠加在背景上；中部以1个圆形匿名人物或主题对象为视觉锚点，左侧排列产品或内容图标，右侧排列执行方式与勾选清单；下半部继续分布缩略场景、工具、设备、标签和桌面物件。仅保留原图真实存在的细线分区与小色块，不新增大卡片、空白输入框或伪文字线。 - 字体：主标题使用大号黑色粗体中文并居中；栏目名使用棕黑色中等字重无衬线中文；说明、清单和标签使用较小的黑色常规无衬线中文，部分重点以低饱和红棕色强调。文字直接落在纸张或原有小色块上。 - 组件与填写要求：填写分类名称、核心定位、目标人群、内容或产品类型、执行方式、关键词、工具设备和行动清单；中央对象及左右、底部视觉逐项对应这些栏目。人物、产品和物件可按目标主题替换为跨行业组件，但数量、尺度、位置层级与视觉重量保持一致。 - 数量与编号：默认不设独立可见编号；需要表达全局次序时，编号与主标题自然合并，不另造页码槽。 - 内容清理：替换原案例文字、数据和示例视觉；删除 Logo、品牌、作者、账号、人物身份、水印、二维码、平台 UI、来源声明、固定页码、期号、年份版本及翻页或发布引导。图片模板中不得保留可读文字、伪文字、占位词或原图不存在的文字容器。
    - id: "xhs-retail-trend-illustrated-cards"
      description: >-
        适合从总览进入若干趋势解释：首张以中心场景连接多项变化，后续复用含三张信息卡的分析页，逐条说明现象、原因、影响人群和结论。视觉采用米白底、红色编号与细线、圆角卡片及手绘生活场景。 可迁移到消费零售、社会习惯、产品演变、空间变化或用户行为趋势。
      text: >-
        - 模板规则：提供主题总览和可重复的单项趋势分析两类页面； 统一使用米白背景、红色主标题、细红线、圆角描边卡片和手绘插画。 总览把多项变化连接到中心主题并展示受影响人群； 单项页拆解成因、变化关系和行动结论。 主 Agent 需补全可靠数据、模块标题、示意画面和底部结论，不复制参考图中的品牌、账号、年份、数字和原文案。 - 可选色板：奶霜玫瑰（#FFF5F6 / #FFFFFF / #3C2F34 / #D98A9A / #8AA6A3 / #F2C57C）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
