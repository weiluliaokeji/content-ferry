        - "https://dumate-bos.bj.bcebos.com/skills/baidu-image-gen/xhs-templates-20260807/technology/xhs-device-comparison-cards/02.png?authorization=bce-auth-v1%2FALTAKzbczLRKgFZKOzUaF6Q2PU%2F2026-08-10T03%3A58%3A03Z%2F-1%2Fhost%2F2e91d5ec6661721e4d3d8368f939aaf79b7130d549b187d4df30b2528ee5b227"
      image_descriptions:
        - description: >-
            - 参考图：模板参考图1，不可重复。 - 用途：建立设备或产品选购主题的封面。 - 布局：浅蓝满版背景中央放一张带轻投影的横向白色大卡，小型无品牌通用设备跨压卡片上边缘；卡片中部的三行标题直接叠加在白卡上，其中第二行位于原图自带的蓝色实心横条内。页面没有参数列表、推荐框、页签或编号。 - 字体：第一、三行使用超大黑色粗体无衬线中文并居中；第二行使用同等级白色粗体中文，居中置于蓝色实心横条。除标题外没有正文、标签或数字。 - 组件与填写要求：填写三行总标题，其中第二行用于核心强调；生成1枚无品牌、无真实型号特征的通用设备作为主题提示。设备可以按主题替换，但不得复刻真实产品外形、摄像头排列、界面或 Logo。 - 数量与编号：固定为1枚设备主视觉和1组三行标题，不显示可见编号。 - 内容清理：替换原案例文字、数据和示例视觉；删除 Logo、品牌、作者、账号、人物身份、水印、二维码、平台 UI、来源声明、固定页码、期号、年份版本及翻页或发布引导。图片模板中不得保留可读文字、伪文字、占位词或原图不存在的文字容器。
        - description: >-
            - 参考图：模板参考图2，可重复。 - 用途：按统一口径呈现单个设备或产品的参数与建议。 - 布局：浅蓝背景上居中放一张带投影的白色竖版纸张。顶部为独立蓝色型号栏；中部左侧为1张大型无品牌设备图，右侧纵排6项参数，每项由小圆形语义图标和直接文字组成；底部是原图自带的蓝色细边框推荐区域。除这些真实容器外不新增卡片或输入框。 - 字体：型号栏使用白色粗体无衬线中文并居中；参数名和值使用黑色中小号无衬线中文，重点值可用红色；底部栏目标题使用黑色粗体，建议正文使用更小的黑色常规字，均位于原有推荐区域内。 - 组件与填写要求：填写对象名、6项统一比较参数和一段选购建议，并生成1张无品牌、无真实型号特征的设备主图；参数字段可按对象类型替换，但同系列详情页字段顺序一致。价格和时间必须注明口径，无法核实时不虚构。 - 数量与编号：默认不显示可见序号；型号、价格和参数数字不是条目编号。 - 内容清理：替换原案例文字、数据和示例视觉；删除 Logo、品牌、作者、账号、人物身份、水印、二维码、平台 UI、来源声明、固定页码、期号、年份版本及翻页或发布引导。图片模板中不得保留可读文字、伪文字、占位词或原图不存在的文字容器。
    - id: "xhs-ai-tools-comparison-torn-paper"
      description: >-
        把多对象横评拆成结论封面、统一维度表、人群选型和能力亮点：青蓝与亮黄撕纸底承载大标题，白色表格负责同尺度比较，分群卡解释谁适合谁，横向图标卡补充输入、输出与行动建议。 可迁移到 AI Agent、设计软件、自动化平台、办公套件及课程或服务选型。
      text: >-
        - 模板规则：模板参考图依次提供横评封面、功能对比表、人群选型和能力亮点四种页面用途，统一使用青蓝与亮黄色撕纸背景、白色或浅黄色内容块、粗黑或彩色标题和手绘工具图标。 页面顺序是默认语义顺序，不是固定输出4张； 主 Agent 需补全工具名称、对比维度和选择建议； 不复制参考图中的 Logo、品牌名称、账号或原文案，可用抽象软件图标替代。 图标占位要求：真实产品 Logo、公司标识、字母徽章和原图 App 图标一律替换为无文字的虚构动漫占位图标；使用抽象小脸、星形角色、圆角机器人、几何精灵或工具符号，同一对象跨页保持一致。 - 可选色板：奶油黄薄荷（#FFF9E8 / #FFFFFF / #2E3D36 / #E7B84B / #75A99C / #EF8D7A）； 暖纸编辑感（#F7F3EA / #FFFFFF / #2D2A26 / #C96E5B / #6F8F72 / #E9C46A）； 治愈鼠尾草（#F4F7F1 / #FFFFFF / #26352D / #6F8F72 / #A8C7B0 / #E7B67A）。 默认优先第一套； 背景保持明亮，深色只用于文字和细线。
